---
# Flux notification provider secret.
#
# 1Password item (vault biggs-sz): flux-matrix-token
#   token  -- access token for @alertbot:gregbob.net on continuwuity
#
# Separate item from matrix-alertmanager-receiver so revoking Flux's copy
# later does not require touching the Alertmanager bridge.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: flux-matrix-token
  namespace: flux-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: flux-matrix-token
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: flux-matrix-token
        property: token
