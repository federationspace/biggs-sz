apiVersion: fluxcd.controlplane.io/v1
kind: FluxInstance
metadata:
  name: flux
  namespace: flux-system
  annotations:
    fluxcd.controlplane.io/reconcileEvery: "1h"
    fluxcd.controlplane.io/reconcileTimeout: "5m"
spec:
  distribution:
    # Pinned 2026-09-13. Was "2.x" (floating). flux-operator v0.41.1 applies a
    # built-in JSON patch to the Receiver CRD at
    # /spec/versions/1/.../eventSources/items/properties/kind/enum/- and newer
    # flux 2.x manifests changed that CRD's version ordering, so the build
    # fails with "doc is missing path" and the whole FluxInstance stalls.
    # v2.8.8 is the last revision this operator applied successfully.
    # Unpin only together with a flux-operator upgrade.
    version: "v2.8.8"
    registry: "ghcr.io/fluxcd"
    artifact: "oci://ghcr.io/controlplaneio-fluxcd/flux-operator-manifests"
  components:
    - source-controller
    - kustomize-controller
    - helm-controller
    - notification-controller
    # - image-reflector-controller
    # - image-automation-controller
    # - source-watcher
  cluster:
    type: kubernetes
    size: medium
    multitenant: false
    networkPolicy: true
    domain: "cluster.local"
  # storage:
    # class: "local-path"
    # size: "10Gi"
  kustomize:
    patches:
      # TEMPORARY (2026-09-13): all Flux controllers are pinned to control-00.
      #
      # cilium's ipv4NativeRoutingCIDR is 10.244.0.0/16 but this cluster's pod
      # CIDR is 10.42.0.0/16 (k3s default), so cross-node pod traffic gets
      # masqueraded to the node IP and arrives with cilium identity
      # "remote-node" instead of a flux-system pod identity. The netpols that
      # cluster.networkPolicy=true generates then deny it, and kustomize-
      # controller cannot reach source-controller when they land on different
      # nodes. Co-locating them sidesteps it: same-node traffic is not
      # masqueraded.
      #
      # Remove this hostname pin once ipv4NativeRoutingCIDR is corrected in
      # kube-system/cilium/app/helmrelease.yaml. Until then Flux has no node
      # redundancy and stops entirely if control-00 is down.
      - target:
          kind: Deployment
        patch: |
          - op: replace
            path: /spec/template/spec/nodeSelector
            value:
              kubernetes.io/os: linux
              kubernetes.io/hostname: control-00
          - op: add
            path: /spec/template/spec/tolerations
            value:
              - key: "CriticalAddonsOnly"
                operator: "Exists"
  sync:
    kind: GitRepository
    provider: github
    url: "https://github.com/federationspace/biggs-sz.git"
    ref: "refs/heads/main"
    path: "clusters/cluster0"
    pullSecret: "flux-system"