apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cloudnative-pg
  namespace: cnpg-system
spec:
  interval: 3m
  chart:
    spec:
      chart: cloudnative-pg
      # Pinned 0.28.3 (operator 1.29.1). Originally bumped from 0.26.1
      # (operator 1.27.1) for the cnpg-kagent cluster's name-only extension
      # inheritance from a ClusterImageCatalog (CNPG >= 1.29 only; the 1.27.1
      # Cluster CRD rejected it with "missing property 'image'"). cnpg-kagent
      # is now retired (Part of #264); the pin stays as the current baseline.
      version: 0.28.3
      sourceRef:
        kind: HelmRepository
        name: cloudnative-pg
        namespace: flux-system
  values:
    crds:
      create: true