apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cloudnative-pg
  namespace: cnpg-system
spec:
  interval: 3m
  chart:
    spec:
      chart: cloudnative-pg
      # Pinned 0.29.2 (operator 1.30.2), the same chart biggs.dog runs.
      # Bumped from 0.28.3 (operator 1.29.1) for the kritika deployment:
      # its role manifests use the DatabaseRole kind, whose CRD only ships
      # from operator 1.30. The 0.28.3 pin originally existed for cnpg-kagent
      # (retired, Part of #264).
      version: 0.29.2
      sourceRef:
        kind: HelmRepository
        name: cloudnative-pg
        namespace: flux-system
  values:
    crds:
      create: true