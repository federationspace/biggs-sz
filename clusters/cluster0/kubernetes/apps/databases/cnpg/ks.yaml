---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cnpg
  namespace: flux-system
spec:
  targetNamespace: cnpg-system
  commonMetadata:
    labels:
      app.kubernetes.io/name: cnpg
  path: ./clusters/cluster0/kubernetes/apps/databases/cnpg/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
  interval: 3m
  retryInterval: 1m
  timeout: 2m
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cnpg-catalog
  namespace: flux-system
spec:
  # NO targetNamespace: ClusterImageCatalog is CLUSTER-SCOPED. The cnpg KS uses
  # targetNamespace: cnpg-system, which stamps metadata.namespace onto every
  # rendered object; on a cluster-scoped resource the API server rejects that.
  # So the catalog is applied by this separate, namespace-less Kustomization.
  dependsOn:
    - name: cnpg
  commonMetadata:
    labels:
      app.kubernetes.io/name: cnpg-catalog
  path: ./clusters/cluster0/kubernetes/apps/databases/cnpg/catalog
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
  interval: 3m
  retryInterval: 1m
  timeout: 2m
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cnpg-barman-plugin
  namespace: flux-system
spec:
  dependsOn:
    - name: cnpg          # operator must exist; plugin must share its namespace
    - name: cert-manager  # plugin chart creates an Issuer + Certificates for mTLS
  targetNamespace: cnpg-system
  commonMetadata:
    labels:
      app.kubernetes.io/name: cnpg-barman-plugin
  path: ./clusters/cluster0/kubernetes/apps/databases/cnpg/barman-plugin/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
  interval: 3m
  retryInterval: 1m
  timeout: 2m
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cnpg-databases
  namespace: flux-system
spec:
  dependsOn:
    - name: cnpg-secrets
    - name: rook-ceph-cluster
    # Ensure the ClusterImageCatalog exists before Clusters reference it by name.
    - name: cnpg-catalog
    # Ensure the ObjectStore CRD (barman-cloud plugin) exists before any
    # cluster references a backup plugin.
    - name: cnpg-barman-plugin
  targetNamespace: cnpg-system
  commonMetadata:
    labels:
      app.kubernetes.io/name: cnpg-databases
  path: ./clusters/cluster0/kubernetes/apps/databases/cnpg/databases
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
  interval: 3m
  retryInterval: 1m
  timeout: 2m
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cnpg-secrets
  namespace: flux-system
spec:
  dependsOn:
    - name: cnpg
  commonMetadata:
    labels:
      app.kubernetes.io/name: cnpg-secrets
  path: ./clusters/cluster0/kubernetes/apps/databases/cnpg/secrets
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
  interval: 3m
  retryInterval: 1m
  timeout: 2m

