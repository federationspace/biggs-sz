apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: cnpg-pinepods-daily
  namespace: cnpg-system
spec:
  # Staggered 10 minutes apart from cnpg-renovate (03:00) so base backups do
  # not overlap (B4 of #261).
  schedule: "0 30 3 * * *"
  immediate: true
  backupOwnerReference: self
  cluster:
    name: cnpg-pinepods
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
