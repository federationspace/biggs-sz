apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: cnpg-renovate-daily
  namespace: cnpg-system
spec:
  # Six fields, seconds first: 03:00 daily. Later clusters in #261 stagger
  # by 10 minutes so base backups do not overlap.
  schedule: "0 0 3 * * *"
  # Take the first base backup right after rollout, without waiting for 03:00.
  immediate: true
  backupOwnerReference: self
  cluster:
    name: cnpg-renovate
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
