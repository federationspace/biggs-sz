---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: cnpg-homarr-daily
  namespace: cnpg-system
spec:
  # Staggered 10 minutes after cnpg-silo (04:00) so base backups do
  # not overlap.
  schedule: "0 10 4 * * *"
  immediate: true
  backupOwnerReference: self
  cluster:
    name: cnpg-homarr
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
