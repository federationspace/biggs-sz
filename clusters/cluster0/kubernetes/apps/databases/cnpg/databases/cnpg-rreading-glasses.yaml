apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: cnpg-rreading-glasses
  namespace: cnpg-system
spec:
  instances: 3
  bootstrap:
    initdb:
      database: rreading-glasses
      owner: rreading-glasses
      dataChecksums: true
      secret:
        name: rreading-glasses-user-password
  imageName: ghcr.io/cloudnative-pg/postgresql:18.1
  resources:
    requests:
      memory: 500Mi
      cpu: 500m
    limits:
      memory: 500Mi
  storage:
    size: 5Gi
    storageClass: local-path
  # Barman Cloud plugin: WAL archiving to the offsite ObjectStore (B2).
  # B4 of #261; proven on the cnpg-renovate pilot (#326).
  plugins:
  - name: barman-cloud.cloudnative-pg.io
    isWALArchiver: true
    parameters:
      barmanObjectName: offsite
