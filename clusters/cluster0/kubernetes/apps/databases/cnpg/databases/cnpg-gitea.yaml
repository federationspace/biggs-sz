apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: cnpg-gitea
  namespace: cnpg-system
spec:
  # enableSuperuserAccess: true
  # superuserSecret:
  #   name: gitea-superuser-password
  instances: 3
  bootstrap:
    initdb:
      database: gitea
      owner: gitea
      dataChecksums: true
      secret:
        name: gitea-user-password
  imageName: ghcr.io/cloudnative-pg/postgresql:18.1
  resources:
    requests:
      memory: 500Mi
      cpu:  500m
    limits:
      memory: 500Mi
  storage:
    size: 15Gi
    storageClass: local-path
  # Barman Cloud plugin: WAL archiving to the offsite ObjectStore (B2).
  # B4 of #261; proven on the cnpg-renovate pilot (#326).
  plugins:
  - name: barman-cloud.cloudnative-pg.io
    isWALArchiver: true
    parameters:
      barmanObjectName: offsite
