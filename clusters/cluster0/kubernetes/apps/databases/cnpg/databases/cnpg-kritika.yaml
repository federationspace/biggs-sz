# cnpg-kritika: Postgres for the kritika AI PR reviewer.
#
# PG 18 standard-bookworm with VectorChord 1.1.1 (image-volume extension) and
# pgvector: kritika's queue, findings, and embeddings live here. Image,
# extension form, and bootstrap mirror the upstream kritika smoke ground
# truth (scripts/smoke.sh), the same image biggs.dog runs for kritika.
# Sizing mirrors biggs.dog's kritika cluster; affinity and the barman
# offsite plugin mirror the sibling clusters in this directory.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: cnpg-kritika
  namespace: cnpg-system
spec:
  instances: 3
  affinity:
    enablePodAntiAffinity: true
    podAntiAffinityType: required
  enableSuperuserAccess: false
  # Direct imageName, not the catalog: the catalog carries no VectorChord,
  # and the vchord-scratch extension image ships Debian's lib paths. This is
  # the upstream kritika smoke image (scripts/smoke.sh), PG 18 + VectorChord.
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-standard-bookworm
  bootstrap:
    initdb:
      database: kritika
      owner: kritika
      dataChecksums: true
      secret:
        name: kritika-user-password
  resources:
    requests:
      memory: 300Mi
      cpu: 150m
    limits:
      memory: 300Mi
  storage:
    storageClass: local-path
    size: 5Gi
  # Barman Cloud plugin: WAL archiving to the offsite ObjectStore (B2),
  # same as the sibling clusters.
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: offsite
  postgresql:
    extensions:
      - name: vchord
        image:
          reference: ghcr.io/tensorchord/vchord-scratch:pg18-v1.1.1
        # The image keeps Debian's paths rather than CNPG's defaults.
        dynamic_library_path:
          - /usr/lib/postgresql/18/lib/
        extension_control_path:
          - /usr/share/postgresql/18/
    shared_preload_libraries:
      - vchord
---
# kritika database + roles on cnpg-kritika.
#
# The Database CR creates the `kritika` DB with pgvector + vchord as
# superuser (the owner `kritika` never needs it). The two DatabaseRoles are
# CNPG's declarative role management; `retain` keeps the role and running
# connections if the CR is deleted. Passwords from 1Password items
# kritika-app-password / kritika-runner-password (ExternalSecrets in
# ../secrets/); kritika's migrations grant the roles what they need.
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: cnpg-kritika-db
  namespace: cnpg-system
spec:
  name: kritika
  owner: kritika
  cluster:
    name: cnpg-kritika
  extensions:
    - name: vector
      ensure: present
    - name: vchord
      version: "1.1.1"   # move with the vchord-scratch image tag
      ensure: present
---
apiVersion: postgresql.cnpg.io/v1
kind: DatabaseRole
metadata:
  name: kritika-app
  namespace: cnpg-system
spec:
  cluster:
    name: cnpg-kritika
  name: kritika_app
  login: true
  passwordSecret:
    name: kritika-app-password
  databaseRoleReclaimPolicy: retain
---
apiVersion: postgresql.cnpg.io/v1
kind: DatabaseRole
metadata:
  name: kritika-runner
  namespace: cnpg-system
spec:
  cluster:
    name: cnpg-kritika
  name: kritika_runner
  login: true
  passwordSecret:
    name: kritika-runner-password
  databaseRoleReclaimPolicy: retain
