apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: cnpg-homarr
  namespace: cnpg-system
spec:
  # enableSuperuserAccess: true
  # superuserSecret:
  #   name: homarr-superuser-password
  instances: 3
  bootstrap:
    initdb:
      database: homarrdb
      owner: homarr
      dataChecksums: true
      secret:
        name: homarr-user-password
  imageName: ghcr.io/cloudnative-pg/postgresql:18.1
  resources:
    requests:
      memory: 500Mi
      cpu:  500m
    limits:
      memory: 500Mi
  storage:
    size: 5Gi
    storageClass: local-path
  # Barman Cloud plugin: WAL archiving to the offsite ObjectStore (B2).
  # Closes the #261 Q3 gap that left cnpg-homarr the only cluster without
  # offsite backups.
  plugins:
  - name: barman-cloud.cloudnative-pg.io
    isWALArchiver: true
    parameters:
      barmanObjectName: offsite
