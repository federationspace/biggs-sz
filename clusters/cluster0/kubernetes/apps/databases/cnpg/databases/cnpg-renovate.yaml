apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: cnpg-renovate
  namespace: cnpg-system
spec:
  instances: 3
  bootstrap:
    initdb:
      database: renovate
      owner: renovate
      dataChecksums: true
      secret:
        name: renovate-user-password
  imageName: ghcr.io/cloudnative-pg/postgresql:18.1
  resources:
    requests:
      memory: 500Mi
      cpu:  500m
    limits:
      memory: 500Mi
      cpu: 500m
  storage:
    size: 15Gi
    storageClass: local-path
