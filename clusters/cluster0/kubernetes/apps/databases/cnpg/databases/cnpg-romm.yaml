apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: cnpg-romm
  namespace: cnpg-system
spec:
  instances: 3
  bootstrap:
    initdb:
      database: romm
      owner: romm
      dataChecksums: true
      secret:
        name: romm-user-password
  imageName: ghcr.io/cloudnative-pg/postgresql:18.1
  resources:
    requests:
      memory: 500Mi
      cpu: 500m
    limits:
      # PostgreSQL 18 leaks executor memory per row (about 215Ki) in UPDATEs on
      # tables with STORED generated columns, and romm's roms table has dozens.
      # romm 5.4.0's full-table backfill on 8454 roms peaked at 1919Mi; a 1Gi
      # limit still OOMs. Raise this if the roms table grows past ~13k rows.
      memory: 3Gi
  storage:
    size: 10Gi
    storageClass: local-path
