---
# Lets AgentgatewayPolicy objects in other namespaces use the oauth2-proxy
# Service as their ext-authz backend. Each guarded app's policy lives in its
# own namespace; add the namespace here when guarding a new one.
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: extauth-to-oauth2-proxy
  namespace: auth
spec:
  from:
    - group: agentgateway.dev
      kind: AgentgatewayPolicy
      namespace: ai-system
    - group: agentgateway.dev
      kind: AgentgatewayPolicy
      namespace: media
  to:
    - group: ""
      kind: Service
      name: oauth2-proxy
