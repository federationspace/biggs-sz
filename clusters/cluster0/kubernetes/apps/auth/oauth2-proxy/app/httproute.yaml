---
# Browser-facing sign-in endpoints (/oauth2/start, /oauth2/callback,
# /oauth2/sign_out). The ext-authz subrequest goes to the Service directly,
# not through this route.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: oauth2-proxy
  namespace: auth
spec:
  hostnames:
    - auth.gregbob.net
  parentRefs:
    - name: wildcard-gregbob-net
      namespace: network
  rules:
    - backendRefs:
        - name: oauth2-proxy
          port: 80
      matches:
        - path:
            type: PathPrefix
            value: /
