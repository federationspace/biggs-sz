---
# Materializes Secret "oauth2-proxy" with the keys the chart reads via
# config.existingSecret: client-id, client-secret, cookie-secret.
#
# 1Password item (vault biggs-sz): oauth2-proxy
#   client-id      Client ID of the Pocket ID OIDC client "oauth2-proxy"
#                  (callback https://auth.gregbob.net/oauth2/callback).
#   client-secret  That client's secret.
#   cookie-secret  32 random bytes, base64: `openssl rand -base64 32`
#                  (44 characters).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: oauth2-proxy
  namespace: auth
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: oauth2-proxy
    creationPolicy: Owner
  data:
    - secretKey: client-id
      remoteRef:
        key: oauth2-proxy
        property: client-id
    - secretKey: client-secret
      remoteRef:
        key: oauth2-proxy
        property: client-secret
    - secretKey: cookie-secret
      remoteRef:
        key: oauth2-proxy
        property: cookie-secret
