# Materializes Secret "pocket-id" (DB_CONNECTION_STRING, ENCRYPTION_KEY),
# consumed via envFrom.
#
# 1Password items (vault biggs-sz):
#   - pocket-id-user-password (username, password): the CNPG role; username
#     MUST be "pocketid" (owner in databases/cnpg/databases/cnpg-pocket-id.yaml).
#   - pocket-id (encryption-key): encrypts the token signing keys in the
#     database. Losing it makes the database unreadable.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pocket-id
  namespace: auth
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: pocket-id
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # urlquery: the password contains URL-reserved characters.
        DB_CONNECTION_STRING: >-
          postgres://{{ .username | urlquery }}:{{ .password | urlquery }}@cnpg-pocket-id-rw.cnpg-system.svc.cluster.local:5432/pocketid
        ENCRYPTION_KEY: "{{ .encryptionKey }}"
  data:
    - secretKey: username
      remoteRef:
        key: pocket-id-user-password
        property: username
    - secretKey: password
      remoteRef:
        key: pocket-id-user-password
        property: password
    - secretKey: encryptionKey
      remoteRef:
        key: pocket-id
        property: encryption-key
