# NetBird client as a privileged hostNetwork DaemonSet.
#
# cluster0 (biggs-sz) is a 4-node cluster. This DaemonSet puts one pod per
# node that:
#   1. registers as a NetBird peer against the NetBird SERVER running in the
#      biggs.dog cluster0 (public endpoint https://netbird.biggs.dog), and
#   2. acts as a NetBird NETWORK ROUTER, publishing cluster0's pod/service
#      CIDRs to the mesh so other peers can reach cluster0 services through
#      these nodes.
#
# === Management URL: public, NOT in-cluster ===
# The netbird server does NOT run in this cluster. It runs in the biggs.dog
# cluster0 (repo ~/Code/biggs.dog, apps/netbird), exposed via agentgateway at
# https://netbird.biggs.dog. An earlier revision pointed NB_MANAGEMENT_URL at
# netbird-server.netbird.svc.cluster.local, a Service DNS name that only
# resolves INSIDE the biggs.dog cluster; here CoreDNS answered NXDOMAIN and
# every pod crash-looped with "failed creating connection to Management
# Service". Management/signal gRPC is routed through that same public hostname
# (h2c HTTPRoute with 24h stream timeouts in the biggs.dog repo), and the
# certificate is publicly valid, so the plain public URL is correct here.
#
# === Why privileged + hostNetwork (and why NOT in the `netbird` namespace) ===
# The `netbird` namespace is PSA `baseline` -- correct for the unprivileged
# server/dashboard. Bringing up the WireGuard interface + installing routes needs
# NET_ADMIN, /dev/net/tun and hostNetwork, all forbidden under baseline, hence a
# separate `netbird-client` namespace labelled `privileged`.
#
# === Cilium / network policy (intentionally none) ===
# cluster0 has NO cluster-wide default-deny and the host firewall is disabled
# (see kube-system/cilium: kubeProxyReplacement=true, no enableHostFirewall).
# A hostNetwork pod carries the reserved:host identity, not a pod-label endpoint
# identity, so namespace CiliumNetworkPolicies wouldn't select it anyway. A
# network router also needs unconstrained egress (management, signal, relay,
# STUN, and dynamic P2P peer endpoints). We therefore deliberately do NOT add a
# CiliumNetworkPolicy here -- the namespace defaults to allow, which is correct
# for this component.
#
# === Publishing the cluster CIDRs (NetBird dashboard, not k8s) ===
# The router role is configured server-side, not in this manifest:
#   * Networks -> Network Resources: add cluster0's pod CIDR and service CIDR
#     (get them with: kubectl get nodes -o jsonpath='{.items[*].spec.podCIDR}'
#      and the service CIDR from the UpCloud cluster / `kubectl cluster-info
#      dump | grep -i service-cluster-ip-range`).
#   * Networks -> Network Routers: add a router whose peer is the "cluster0"
#     peer this DaemonSet registers as (NB_HOSTNAME=cluster0), with masquerade
#     ON so pods see traffic from the node IP (no return route needed in-pod).
#   * Access Control -> Policies: allow the peer groups that should reach those
#     CIDRs (e.g. the cluster1 node, road-warriors).
# The client MUST NOT pass --disable-server-routes (default leaves them enabled,
# which is what makes it act as a router). Do not add that flag.
#
# === UpCloud firewall ===
# For direct P2P (not just relay), allow inbound UDP 51820 (NB_WIREGUARD_PORT,
# the WireGuard listen port) to the node's public IP. Without it peers fall back
# to the relay (netbird-server), which still works but is not P2P.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: netbird-client
  namespace: netbird-client
  labels:
    app.kubernetes.io/name: netbird-client
    app.kubernetes.io/component: router
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: netbird-client
      app.kubernetes.io/component: router
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: netbird-client
        app.kubernetes.io/component: router
    spec:
      hostNetwork: true
      # Resolve the in-cluster netbird-server Service FQDN. Without this a
      # hostNetwork pod uses the node's resolv.conf and won't resolve *.svc.
      dnsPolicy: ClusterFirstWithHostNet
      terminationGracePeriodSeconds: 30
      initContainers:
        - name: sysctl
          image: busybox:1.38
          securityContext:
            privileged: true
          command:
            - /bin/sh
            - -c
            - |
              set -e
              # IP forwarding is mandatory for a subnet router. Cilium already
              # sets net.ipv4.ip_forward=1 on the node; this is idempotent
              # insurance against a node where it isn't. rp_filter=2 (loose)
              # avoids asymmetric-route drops for traffic in via wt0 / out via
              # the node NIC -- a classic VPN-router failure mode. If you hit
              # rp_filter-related oddities, the alternative is to leave this
              # alone and set NB_USE_LEGACY_ROUTING=true on the netbird container.
              sysctl -w net.ipv4.ip_forward=1 || true
              sysctl -w net.ipv4.conf.all.rp_filter=2 || true
      containers:
        - name: netbird
          # Client image; pinned to match the server release (netbirdio/netbird
          # and netbirdio/netbird-server ship together). Confirm the tag exists
          # for the client image if you bump the server.
          image: netbirdio/netbird:0.77.0
          # Binary lives at /usr/local/bin/netbird in current images (moved from
          # /go/bin/netbird in older releases -- the old path broke the pod with
          # "exec: /go/bin/netbird: no such file or directory"). We invoke the
          # binary directly, bypassing the image's netbird-entrypoint.sh (which
          # wraps `service run` + `up` in a bash supervisor): foreground mode
          # runs the daemon in-process as a single PID, which is the k8s-native
          # shape. All config comes from NB_* env vars (precedence:
          # env > flag > config file).
          command: ["/usr/local/bin/netbird"]
          args: ["up", "--foreground-mode"]
          env:
            - name: NB_MANAGEMENT_URL
              # Public endpoint of the netbird server in the biggs.dog cluster.
              # Management/signal gRPC and relay all work over this hostname
              # (agentgateway terminates TLS, h2c to the pod; see apps/netbird
              # in the biggs.dog repo). The node egresses via its public IP,
              # which the server side allows. NB_ADMIN_URL below matches.
              value: "https://netbird.biggs.dog"
            - name: NB_ADMIN_URL
              value: "https://netbird.biggs.dog"
            - name: NB_SETUP_KEY
              valueFrom:
                secretKeyRef:
                  name: netbird-client-setup-key
                  key: setup-key
            - name: NB_CONFIG
              value: "/var/lib/netbird/config.json"
            - name: NB_STATE_DIR
              value: "/var/lib/netbird"
            - name: NB_HOSTNAME
              # Makes the peer identifiable in the dashboard; this is the name
              # to pick as the routing peer when configuring a Network Router.
              value: "cluster0"
            - name: NB_LOG_FILE
              value: "console"
            - name: NB_LOG_LEVEL
              value: "info"
            # --- hostNetwork hygiene: do NOT rewrite the node's config ---
            # The client would otherwise inject mesh DNS into /etc/resolv.conf
            # and write /etc/ssh/ssh_config.d/99-netbird.conf ON THE NODE, which
            # could break node/kubelet DNS. A pure subnet router doesn't need
            # either, so disable both.
            - name: NB_DISABLE_DNS
              value: "true"
            - name: NB_DISABLE_SSH_CONFIG
              value: "true"
          securityContext:
            privileged: true
            capabilities:
              add: [NET_ADMIN, SYS_ADMIN, NET_RAW]
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: tun
              mountPath: /dev/net/tun
            - name: state
              mountPath: /var/lib/netbird
          # NOTE: no readiness/liveness probe. The natural check,
          # `netbird status --check ready`, needs the daemon's unix socket
          # (/var/run/netbird.sock), which foreground mode does NOT create
          # (verified on 0.74.3: no socket in /var/run, none in
          # /proc/net/unix across the host netns; status CLI fails with
          # "failed to connect to daemon"). A probe that can never succeed
          # keeps every pod NotReady forever and fails the Flux health check.
          # Health signal is the process itself: a hung/exited daemon
          # crash-loops the container and shows in DS status/restarts.
      volumes:
        - name: tun
          hostPath:
            path: /dev/net/tun
            type: CharDevice
        - name: state
          # Persist WireGuard keypair + login so pod restarts reuse the same
          # peer rather than re-registering. Distinct from the netbird SERVER's
          # PVC-backed /var/lib/netbird (that's inside the server pod); this is
          # a node hostPath.
          hostPath:
            path: /var/lib/netbird-client
            type: DirectoryOrCreate
