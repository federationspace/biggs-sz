---
# Matrix alert bridge credentials.
#
# 1Password item (vault biggs-sz): matrix-alertmanager-receiver
#   access-token   -- access token for @alertbot:gregbob.net on continuwuity.
#                     Minted with `!admin users issue-token alertbot <pw>` from
#                     the admin room. It is bound to a DEVICE and stays valid
#                     until that device is logged out; `!admin users logout
#                     alertbot` or "sign out all other sessions" in any client
#                     silently kills alert delivery. The only symptom would be
#                     M_UNKNOWN_TOKEN in this pod's logs.
#   user-id        -- "@alertbot:gregbob.net"
#   basic-password -- shared secret; Alertmanager presents it as basic auth
#                     (username: alertmanager) when POSTing to this service.
#
# All three are consumed as ENV VARS rather than a mounted config: the
# receiver expands ${VAR} placeholders in its YAML config at parse time
# (internal/config/parser.go), so configmap.yaml stays secret-free in Git.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: matrix-alertmanager-receiver
  namespace: observability
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: matrix-alertmanager-receiver
    creationPolicy: Owner
    template:
      data:
        MATRIX_ACCESS_TOKEN: "{{ .accessToken }}"
        MATRIX_USER_ID: "{{ .userId }}"
        WEBHOOK_BASIC_PASSWORD: "{{ .basicPassword }}"
  data:
    - secretKey: accessToken
      remoteRef:
        key: matrix-alertmanager-receiver
        property: access-token
    - secretKey: userId
      remoteRef:
        key: matrix-alertmanager-receiver
        property: user-id
    - secretKey: basicPassword
      remoteRef:
        key: matrix-alertmanager-receiver
        property: basic-password
---
# The SAME webhook password, in the shape VMAlertmanager wants.
#
# alertmanager.config in the victoria-metrics HelmRelease is rendered by Helm
# into a plain Secret, so a literal password there would be hardcoded in Git.
# Instead the Alertmanager config uses `password_file`, and VMAlertmanager
# mounts every Secret named in `alertmanager.spec.secrets` at
# /etc/alertmanager/secrets/<name>/<key>. Hence: secret `matrix-webhook`,
# key `password` -> /etc/alertmanager/secrets/matrix-webhook/password.
#
# Both consumers read the same 1Password field, so rotating it is one edit.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: matrix-webhook
  namespace: observability
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: matrix-webhook
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: matrix-alertmanager-receiver
        property: basic-password
