---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rook-ceph-operator
  namespace: rook-ceph
spec:
  interval: 3m
  releaseName: rook-ceph-operator
  chart:
    spec:
      chart: rook-ceph
      version: 1.21.0
      sourceRef:
        kind: HelmRepository
        name: rook-ceph
        namespace: flux-system
  values:
    # v1.20 breaking change: CSI driver settings moved out of this chart to
    # the ceph-csi-operator (deployed as a subchart; csi.installCsiOperator
    # defaults to true, with csiServiceAccountPrefix set to "" by the rook
    # chart). The old operator: section and csi.enableCephfsDriver /
    # csi.enableLiveness-style keys no longer exist in the chart values, so
    # they were dropped here. The RBD driver ServiceAccounts/RBAC the
    # ceph-csi-operator expects (rbd-ctrlplugin-sa / rbd-nodeplugin-sa) are
    # managed in ../csi-rbac.
    crds:
      enabled: true
    # v1.21.0 renders ROOK_CREATE_CSI_OPERATOR_RESOURCES into the operator
    # ConfigMap, but the chart no longer ships a default for it, so it renders
    # as "" and the operator reads that as off. Off makes Rook DELETE the
    # CephConnection and ClientProfile the RBD CSI driver uses to reach the
    # mons. Set it explicitly until upstream restores the default.
    csi:
      createCsiOperatorResources: true
    enableDiscoveryDaemon: true
    # Only grants the operator RBAC to create ServiceMonitors, which this
    # cluster does not use (Ceph is scraped by VMServiceScrapes). See the
    # monitoring block in ../cluster/helmrelease.yaml.
    monitoring:
      enabled: false
    resources:
      requests:
        memory: 128Mi # unchangable
        cpu: 100m # unchangable
      limits: {}
