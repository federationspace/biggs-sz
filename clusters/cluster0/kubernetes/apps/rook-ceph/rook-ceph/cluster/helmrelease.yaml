---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rook-ceph-cluster
  namespace: rook-ceph
spec:
  interval: 5m
  chart:
    spec:
      chart: rook-ceph-cluster
      version: v1.20.4
      sourceRef:
        kind: HelmRepository
        name: rook-ceph
        namespace: flux-system
  values:
    monitoring:
      enabled: true
      # createPrometheusRules: true
    toolbox:
      enabled: true
    # Pin Squid: the v1.20.4 chart default is ceph Tentacle v20.2.2, which
    # would start a major upgrade on merge. v19.2.6 is the latest Squid and
    # includes the OSD async-discard crash fix (ceph pr#65214, first in
    # v19.2.4), so bdev_async_discard_threads is restored to "1" below
    # (see PR #47). Revisit when intentionally upgrading to Tentacle.
    cephImage:
      repository: quay.io/ceph/ceph
      tag: v21.1.0
    cephClusterSpec:
      healthCheck:
        livenessProbe:
          osd:
            probe:
              # osd.2 on worker-05 (slowest NVMe, 24ms apply latency vs 4-8ms
              # on peers) answers its admin socket in >5s during peering,
              # which tripped the default 5s x 3 liveness probe and put the
              # OSD in a kill/re-peer flap loop (1200+ restarts, cluster
              # stuck 33% degraded). Give it headroom.
              timeoutSeconds: 30
              failureThreshold: 6
      cephConfig:
        global:
          bdev_enable_discard: "true" # quote
          # 1 is the ceph default. osd.2 on worker-05 crash-looped on
          # v19.2.3 with 367 restarts (abort in KernelDevice::_discard_thread);
          # the fix landed in v19.2.4 (ceph pr#65214). Pinned to v19.2.6
          # above, so the async discard threads are re-enabled.
          bdev_async_discard_threads: "1" # quote
          osd_class_update_on_start: "false" # quote
          device_failure_prediction_mode: local # requires mgr module
      # TODO: Enable the following options whenever deploying to a new cluster
      # cleanupPolicy:
      #   wipeDevicesFromOtherClusters: true
      crashCollector:
        disable: false
        daysToRetain: 30
      csi:
        readAffinity:
          enabled: true
      dashboard:
        enabled: true
        urlPrefix: /
        ssl: false
        prometheusEndpoint: http://vmsingle-stack.observability.svc.cluster.local:8428
      mgr:
        count: 1
        modules:
          - name: pg_autoscaler
            enabled: true
          - name: rook
            enabled: true
          - name: telemetry
            enabled: false
      mon:
        count: 3
        allowMultiplePerNode: false
      network:
        provider: host
        connections:
          requireMsgr2: true
      resources:
        mon:
          requests:
            cpu: 35m
            memory: 512Mi
          limits:
            memory: 768Mi
        osd:
          requests:
            cpu: 100m
            memory: 1Gi
          limits:
            memory: 4Gi
      storage:
        useAllNodes: false
        useAllDevices: false
        nodes:
          - name: worker-00
            devices:
              - name: /dev/mapper/ubuntu--vg-lvceph
          - name: worker-01
            devices:
              - name: /dev/mapper/ubuntu--vg-lvceph
          - name: worker-05
            devices:
              - name: /dev/vgroot/lvceph
        config:
          osdsPerDevice: "1"

    ingress:
      dashboard:
        host:
          name: rook-ceph.gregbob.net
          path: "/"
          pathType: Prefix
        ingressClassName: external

    cephBlockPools:
      - name: ceph-blockpool
        spec:
          failureDomain: host
          replicated:
            size: 3
        storageClass:
          enabled: true
          name: ceph-block
          isDefault: false
          reclaimPolicy: Delete
          allowVolumeExpansion: true
          volumeBindingMode: Immediate
          mountOptions: ["discard"]
          parameters:
            imageFormat: "2"
            imageFeatures: layering,fast-diff,object-map,deep-flatten,exclusive-lock
            csi.storage.k8s.io/provisioner-secret-name: rook-csi-rbd-provisioner
            csi.storage.k8s.io/provisioner-secret-namespace: rook-ceph
            csi.storage.k8s.io/controller-expand-secret-name: rook-csi-rbd-provisioner
            csi.storage.k8s.io/controller-expand-secret-namespace: rook-ceph
            csi.storage.k8s.io/node-stage-secret-name: rook-csi-rbd-node
            csi.storage.k8s.io/node-stage-secret-namespace: rook-ceph
            csi.storage.k8s.io/fstype: ext4

    # cephBlockPoolsVolumeSnapshotClass:
    #   enabled: true
    #   name: csi-ceph-blockpool
    #   isDefault: false
    #   deletionPolicy: Delete

    # NOTE: After disabling the filesystem, the filesystem can be removed with the following commands:
    # ceph fs fail ceph-filesystem && ceph fs rm ceph-filesystem --yes-i-really-mean-it
    cephFileSystems: []

    cephObjectStores: []
