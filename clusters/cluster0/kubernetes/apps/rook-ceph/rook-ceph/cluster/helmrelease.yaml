---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rook-ceph-cluster
  namespace: rook-ceph
spec:
  interval: 5m
  # Rook rotates keys and rolls daemons well past Helm's default 5m wait; a
  # timeout leaves the HR Stalled and blocks dependents (cnpg-databases).
  timeout: 30m
  chart:
    spec:
      chart: rook-ceph-cluster
      version: 1.21.0
      sourceRef:
        kind: HelmRepository
        name: rook-ceph
        namespace: flux-system
  values:
    # Ceph alerting. Metrics are scraped by the VMServiceScrapes in
    # vmservicescrape.yaml (VM-native), so monitoring.enabled stays false: true
    # only makes Rook try to create ServiceMonitors, and this cluster has no
    # ServiceMonitor CRD by design (see observability/prometheus-operator-crds).
    # metricsDisabled stays false, which keeps the mgr prometheus module and the
    # per-node ceph-exporter running.
    # createPrometheusRules ships Ceph's upstream alert set as a PrometheusRule;
    # the VM operator converts it to a VMRule for vmalert.
    monitoring:
      enabled: false
      createPrometheusRules: true
      prometheusRuleOverrides:
        # Accepted, known warnings while CSI keys migrate to aes256k. The prior
        # aes CSI key (keepPriorKeyCountMax: 1) keeps AUTH_INSECURE_CLIENT_KEY_TYPE
        # up until it is dropped, and the KEYS_ALLOWED/KEYS_CREATABLE pair until
        # allowedCiphers is restricted to aes256k (see security.cephx below).
        # Without this the alert would fire permanently and train us to ignore
        # it. Fires on any OTHER health check; drop the exclusion after
        # allowedCiphers lands.
        CephHealthWarning:
          expr: >-
            ceph_health_status == 1 and on()
            (max(ceph_health_detail{name!~"AUTH_INSECURE_(CLIENT_KEY_TYPE|KEYS_ALLOWED|KEYS_CREATABLE)"}) == 1)
        # Upstream selects job="ceph" (a plain Prometheus job name); ours is
        # rook-ceph-mgr, so the stock rule could never fire.
        CephMgrPrometheusModuleInactive:
          expr: up{job="rook-ceph-mgr"} == 0
    toolbox:
      enabled: true
    # No cephImage pin, by design: the Ceph version is the Rook chart default
    # (v1.20.8 ships quay.io/ceph/ceph:v20.2.4, Tentacle), which Rook only sets
    # to a stable release it supports. Ceph majors therefore arrive only through
    # manually merged Rook bumps (Renovate never automerges rook-ceph charts).
    # See .hermes/plans/2026-10-11_104925-ceph-upgrade-living-plan.md.
    cephClusterSpec:
      healthCheck:
        livenessProbe:
          osd:
            probe:
              # Historical: osd.2 on the retired worker-05 (unbranded Gen3 NVMe,
              # 24ms apply latency vs 4-8ms on the Samsung 980 PRO peers)
              # answered its admin socket in >5s during peering, which tripped
              # the default 5s x 3 liveness probe and put the OSD in a
              # kill/re-peer flap loop (1200+ restarts, cluster stuck 33%
              # degraded). That node is gone, but keep the headroom. It is
              # harmless on a fast disk, rediscovering this the hard way after a
              # future flap costs an outage, and it is directly relevant again:
              # worker-02 carries that same physical NVMe and, like worker-05,
              # shares it between root and the OSD.
              timeoutSeconds: 30
              failureThreshold: 6
      cephConfig:
        global:
          bdev_enable_discard: "true" # quote
          # 1 is the ceph default. Historical: osd.2 on the retired worker-05
          # crash-looped on v19.2.3 with 367 restarts (abort in
          # KernelDevice::_discard_thread); the fix landed in v19.2.4
          # (ceph pr#65214) and is included in Tentacle, so the async discard
          # threads stay enabled.
          bdev_async_discard_threads: "1" # quote
          osd_class_update_on_start: "false" # quote
          device_failure_prediction_mode: local # requires mgr module
      # TODO: Enable the following options whenever deploying to a new cluster
      # cleanupPolicy:
      #   wipeDevicesFromOtherClusters: true
      crashCollector:
        disable: false
        daysToRetain: 30
      csi:
        readAffinity:
          enabled: true
      dashboard:
        enabled: true
        urlPrefix: /
        ssl: false
        prometheusEndpoint: http://vmsingle-stack.observability.svc.cluster.local:8428
      mgr:
        count: 1
        modules:
          - name: pg_autoscaler
            enabled: true
          # Rook recommends disabling the rook module before Tentacle
          - name: rook
            enabled: false
          - name: telemetry
            enabled: false
      mon:
        count: 3
        allowMultiplePerNode: false
      network:
        provider: host
        connections:
          requireMsgr2: true
      # CVE-2025-30156: rotate every CephX key to clear AUTH_INSECURE_SERVICE_KEY_TYPE
      # (HEALTH_ERR, which also blocks Rook from upgrading Ceph). Bump keyGeneration
      # to rotate again. Do not set allowedCiphers yet: PVCs mounted before the
      # CSI rotation still authenticate with the prior aes key, so restricting
      # ciphers to aes256k would cut them off. Order: rotate CSI to aes256k, drain
      # each node so its PVCs remount with the new key, set keepPriorKeyCountMax: 0,
      # then allowedCiphers: [aes256k].
      security:
        cephx:
          daemon:
            keyRotationPolicy: KeyGeneration
            keyGeneration: 2
          csi:
            keyRotationPolicy: KeyGeneration
            keyGeneration: 3
            keepPriorKeyCountMax: 1 # gen 2 (aes) stays valid for PVCs already mounted
            keyType: aes256k # krbd needs kernel 7.0+; every node runs 7.0.0-38 since 2026-10-18
          rbdMirrorPeer:
            keyRotationPolicy: KeyGeneration
            keyGeneration: 2 # no peer configured, so the default key type is fine
      resources:
        mon:
          requests:
            cpu: 35m
            memory: 512Mi
          limits:
            memory: 768Mi
        osd:
          requests:
            cpu: 100m
            memory: 1Gi
          limits:
            memory: 4Gi
      storage:
        useAllNodes: false
        useAllDevices: false
        nodes:
          - name: worker-00
            devices:
              - name: /dev/mapper/ubuntu--vg-lvceph
          - name: worker-01
            devices:
              - name: /dev/mapper/ubuntu--vg-lvceph
          # worker-02 (GMKtec NucBox K17) replaced worker-05 on 2026-09-13 and
          # carries worker-05's original NVMe. Only one M.2 slot is populated,
          # so root and the OSD share a spindle, same as worker-05 did. That
          # contention is part of why osd.2 ran at ~24ms apply latency against
          # 4-8ms on its peers, so move this to a dedicated whole-disk by-id
          # device once a second NVMe is fitted.
          - name: worker-02
            devices:
              - name: /dev/mapper/ubuntu--vg-lvceph
        config:
          osdsPerDevice: "1"

    ingress:
      dashboard:
        host:
          name: rook-ceph.gregbob.net
          path: "/"
          pathType: Prefix
        ingressClassName: external

    cephBlockPools:
      - name: ceph-blockpool
        spec:
          failureDomain: host
          replicated:
            size: 3
        storageClass:
          enabled: true
          name: ceph-block
          isDefault: false
          reclaimPolicy: Delete
          allowVolumeExpansion: true
          volumeBindingMode: Immediate
          mountOptions: ["discard"]
          parameters:
            imageFormat: "2"
            imageFeatures: layering,fast-diff,object-map,deep-flatten,exclusive-lock
            csi.storage.k8s.io/provisioner-secret-name: rook-csi-rbd-provisioner
            csi.storage.k8s.io/provisioner-secret-namespace: rook-ceph
            csi.storage.k8s.io/controller-expand-secret-name: rook-csi-rbd-provisioner
            csi.storage.k8s.io/controller-expand-secret-namespace: rook-ceph
            csi.storage.k8s.io/node-stage-secret-name: rook-csi-rbd-node
            csi.storage.k8s.io/node-stage-secret-namespace: rook-ceph
            csi.storage.k8s.io/fstype: ext4

    # cephBlockPoolsVolumeSnapshotClass:
    #   enabled: true
    #   name: csi-ceph-blockpool
    #   isDefault: false
    #   deletionPolicy: Delete

    # NOTE: After disabling the filesystem, the filesystem can be removed with the following commands:
    # ceph fs fail ceph-filesystem && ceph fs rm ceph-filesystem --yes-i-really-mean-it
    cephFileSystems: []

    cephObjectStores: []
