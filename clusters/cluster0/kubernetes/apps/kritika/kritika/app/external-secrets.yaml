---
# Secrets for the kritika release.
#
# Two DB uri secrets (kritika-postgres-credentials / -app), basic-auth as
# CNPG expects, each with username / password / uri keys. The chart reads
# only the `uri` key. Each sources the same 1Password item its cnpg-system
# ExternalSecret counterpart reads: kritika-user-password,
# kritika-app-password. Since chart 0.0.116 the runner holds no database
# credential, so there is no runner secret here.
#
# kritika-credentials (envFrom'd by the serve pods): ADMIN_PASSWORD from
# item kritika-admin-password, the GitHub App keys from kritika-github-app,
# the Nous Portal API key from nous-api-key, the in-cluster Radiance engine
# key from radiance (the item ai-system/radiance reads).
#
# All items must exist in the biggs-sz vault before the release can start;
# the ExternalSecrets will not sync until they are created (see the PR body).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kritika-postgres-credentials
  namespace: kritika
  labels:
    app.kubernetes.io/name: kritika
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: kritika-postgres-credentials
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: kubernetes.io/basic-auth
      data:
        username: "{{ .username }}"
        password: "{{ .password }}"
        uri: >-
          postgres://{{ .username | urlquery }}:{{ .password | urlquery }}@cnpg-kritika-rw.cnpg-system.svc.cluster.local:5432/kritika?sslmode=require&connect_timeout=10
  data:
    - secretKey: username
      remoteRef:
        key: kritika-user-password
        property: username
    - secretKey: password
      remoteRef:
        key: kritika-user-password
        property: password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kritika-postgres-app
  namespace: kritika
  labels:
    app.kubernetes.io/name: kritika
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: kritika-postgres-app
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: kubernetes.io/basic-auth
      data:
        username: "{{ .username }}"
        password: "{{ .password }}"
        uri: >-
          postgres://{{ .username | urlquery }}:{{ .password | urlquery }}@cnpg-kritika-rw.cnpg-system.svc.cluster.local:5432/kritika?sslmode=require&connect_timeout=10
  data:
    - secretKey: username
      remoteRef:
        key: kritika-app-password
        property: username
    - secretKey: password
      remoteRef:
        key: kritika-app-password
        property: password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kritika-credentials
  namespace: kritika
  labels:
    app.kubernetes.io/name: kritika
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: kritika-credentials
    creationPolicy: Owner
  data:
    - secretKey: ADMIN_PASSWORD
      remoteRef:
        key: kritika-admin-password
        property: password
    - secretKey: GITHUB_APP_PRIVATE_KEY
      remoteRef:
        key: kritika-github-app
        property: private-key
    - secretKey: GITHUB_APP_WEBHOOK_SECRET
      remoteRef:
        key: kritika-github-app
        property: webhook-secret
    - secretKey: NOUS_API_KEY
      remoteRef:
        key: nous-api-key
        property: api-key
    - secretKey: RADIANCE_API_KEY
      remoteRef:
        key: radiance
        property: api-key
