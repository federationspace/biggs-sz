---
# Public route for kritika.gregbob.net on the wildcard-gregbob-net gateway
# (TLS terminates there with the *.gregbob.net cert): webhooks (POST
# /hooks/github) and the dashboard share the one port. No forward-auth on
# this route: GitHub webhook deliveries cannot complete an interactive
# login, and the dashboard has its own sign-in (local admin; Pocket ID OIDC
# via an AgentgatewayPolicy can be layered later).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kritika
  namespace: kritika
  labels:
    app.kubernetes.io/name: kritika
spec:
  hostnames:
    - kritika.gregbob.net
  parentRefs:
    - name: wildcard-gregbob-net
      namespace: network
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: kritika
          port: 8080
