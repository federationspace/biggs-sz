---
# Sunshine serves its web UI over HTTPS with a self-signed certificate
# (CN "Sunshine Gamestream Host", RSA 2048, no SAN, valid until 2046). It is a
# public certificate, not a secret, so it lives in a ConfigMap.
#
# Pinned to the exact cert: SHA256 fingerprint
#   97:51:C8:99:E4:70:18:7A:FB:21:02:08:A6:C4:6F:70:A0:9C:43:B6:73:C3:BD:6E:C1:23:60:7D:7A:98:E6:E5
# Source on the host:
#   ~/.var/app/dev.lizardbyte.app.Sunshine/config/sunshine/credentials/cacert.pem
# If Sunshine regenerates its credentials (reinstall, wiped config), the
# gateway will return 503 for sunshine.gregbob.net until this is refreshed.
apiVersion: v1
kind: ConfigMap
metadata:
  name: sunshine-ca
data:
  ca.crt: |
