---
# Originate TLS from the gateway to Sunshine and trust ONLY the pinned cert
# above. insecureSkipVerify: Hostname keeps chain verification (against
# sunshine-ca) but skips the hostname/SAN check, because the cert carries no
# SAN and its CN is not a hostname. The standard BackendTLSPolicy cannot do
# this: it always verifies the hostname.
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: sunshine-backend-tls
spec:
  targetRefs:
    - group: ""
      kind: Service
      name: sunshine
  backend:
    tls:
      caCertificateRefs:
        - name: sunshine-ca
      insecureSkipVerify: Hostname
      # Sunshine's web server (Simple-Web-Server) speaks HTTP/1.1 only.
      alpnProtocols:
        - http/1.1
