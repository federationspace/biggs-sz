---
# sunshine.gregbob.net -> Sunshine admin web UI on the gaming PC.
#
# LAN-ONLY BY DESIGN. Sunshine's admin UI can pair new streaming clients and
# define apps that run arbitrary commands on the gaming PC, so it must not be
# reachable from the internet. This route therefore attaches to the
# `internal-gregbob-net` Gateway (VIP 192.168.2.11, not port-forwarded), NOT to
# the public `wildcard-gregbob-net` Gateway (192.168.2.9, which the router
# exposes on 80/443). Public DNS still resolves *.gregbob.net to Cloudflare,
# and Cloudflare reaches only the public Gateway, which has no
# sunshine.gregbob.net route, so off-LAN requests get a 404 there.
# On the LAN and over WireGuard, lan-dns/k8s-gateway answer with 192.168.2.11.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: sunshine
spec:
  hostnames:
    - sunshine.gregbob.net
  parentRefs:
    - name: internal-gregbob-net
      namespace: network
  rules:
    - backendRefs:
        - name: sunshine
          port: 47990
      # POST /api/pin holds the request open until the Moonlight client
      # finishes the pairing handshake; give it headroom.
      timeouts:
        request: 120s
        backendRequest: 120s
