---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: listenarr
  namespace: media
spec:
  hostnames:
    - listenarr.gregbob.net
  parentRefs:
    - name: wildcard-gregbob-net
      namespace: network
  rules:
    - backendRefs:
        - name: listenarr-service
          port: 4545
      matches:
        - path:
            type: PathPrefix
            value: /
