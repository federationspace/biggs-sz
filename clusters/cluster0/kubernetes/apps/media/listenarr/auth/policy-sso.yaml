---
# Pocket ID single sign-on for the listenarr route via oauth2-proxy
# (ext-authz). Per request, agentgateway asks oauth2-proxy /oauth2/auth with
# the browser's cookie:
#   202 -> signed in, the request continues to Listenarr;
#   401 -> redirect to auth.gregbob.net/oauth2/start, which signs in with
#          Pocket ID and returns to the same path.
# Only the cookie is forwarded to oauth2-proxy, and only identity headers
# come back.
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: listenarr-sso
  namespace: media
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: listenarr
  traffic:
    extAuth:
      backendRef:
        group: ""
        kind: Service
        name: oauth2-proxy
        namespace: auth
        port: 80
      http:
        path: '"/oauth2/auth"'
        allowedRequestHeaders:
          - cookie
        allowedResponseHeaders:
          - x-auth-request-user
          - x-auth-request-email
          - x-auth-request-groups
          - x-auth-request-preferred-username
        redirect: '"https://auth.gregbob.net/oauth2/start?rd=https://listenarr.gregbob.net" + request.path'
