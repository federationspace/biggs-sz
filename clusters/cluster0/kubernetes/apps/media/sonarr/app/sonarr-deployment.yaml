apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: sonarr
  name: sonarr
  namespace: media
spec:
  template:
    metadata:
      labels:
        app: sonarr
    spec:
      nodeSelector:
        kubernetes.io/hostname: control-00
      containers:
        # Pinned so upgrades are opt-in, and the pin is what puts sonarr under
        # Renovate at all: Renovate cannot parse a version out of `:latest`, so
        # with that tag it proposed nothing and new builds instead arrived
        # silently on any pod restart (imagePullPolicy is Always). Use the full
        # X.Y.Z.BUILD-lsNNN build tag; the bare 4.0.20 alias is republished on
        # every build of that minor, so it floats.
        - image: lscr.io/linuxserver/sonarr:4.0.20.3014-ls325
          imagePullPolicy: Always
          name: sonarr
          env:
          - name: TZ
            value: "America/Detroit"
          - name: PUID
            value: "1000"
          - name: PGID
            value: "1000"
          ports:
          - name: sonarr-port
            containerPort: 8989
            protocol: TCP
          volumeMounts:
          - name: sonarr-config
            mountPath: /config
          - name: sonarr-media
            mountPath: /data
          resources:
            requests:
              memory: 3Gi
              cpu: 500m
            limits:
              memory: 3Gi
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      volumes:
      - name: sonarr-config
        persistentVolumeClaim:
          claimName: "sonarr-config-ceph"
      - name: sonarr-media
        persistentVolumeClaim:
          claimName: "media-pvc"
  selector:
    matchLabels:
      app: sonarr
