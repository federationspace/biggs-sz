apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pinepods-secrets
  namespace: media
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    creationPolicy: Owner
  data:
  # Password for the `pinepods` Postgres role; same 1Password item that
  # bootstraps the CNPG cluster in cnpg-system.
  - secretKey: DB_PASSWORD
    remoteRef:
      key: "pinepods-user-password"
      property: password
  # Default admin account created on first boot.
  - secretKey: USERNAME
    remoteRef:
      key: "pinepods-admin-credentials"
      property: username
  - secretKey: PASSWORD
    remoteRef:
      key: "pinepods-admin-credentials"
      property: password
  - secretKey: EMAIL
    remoteRef:
      key: "pinepods-admin-credentials"
      property: email
