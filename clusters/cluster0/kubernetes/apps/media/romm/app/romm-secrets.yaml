apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: romm-secrets
  namespace: media
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    creationPolicy: Owner
  data:
  - secretKey: DB_PASSWD
    remoteRef:
      key: "romm-user-password"
      property: password
  - secretKey: ROMM_AUTH_SECRET_KEY
    remoteRef:
      key: "romm-auth"
      property: secret_key
