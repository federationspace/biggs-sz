apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: romm
  name: romm
  namespace: media
spec:
  replicas: 1
  # No surge: all three volumes are RWO ceph-block, so a surge pod scheduled
  # to a different node stalls on Multi-Attach until the old pod is deleted
  # by hand. maxSurge 0 stops the old pod first, trading a short outage for
  # a rollout that always completes. Not `type: Recreate`: Flux's server-side
  # apply cannot clear the API-defaulted rollingUpdate block, so it rejects
  # that change on this existing object.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: romm
  template:
    metadata:
      labels:
        app: romm
    spec:
      # Soft preference only: keep romm off control-00 (control plane, NAS
      # host, and home of the pinned *arr/sabnzbd pods) when a worker can
      # take it, but still fall back to control-00 if no worker fits.
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values:
                      - control-00
      containers:
        # Pinned: romm runs its pending alembic migrations on every start, so a
        # floating tag turned a routine pod restart into an unreviewed schema
        # upgrade. Bump through a Renovate PR.
        - image: rommapp/romm:5.4.1
          imagePullPolicy: IfNotPresent
          name: romm
          env:
            - name: TZ
              value: "America/Detroit"
            - name: DB_HOST
              value: "cnpg-romm-rw.cnpg-system.svc.cluster.local"
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: "romm"
            - name: DB_USER
              value: "romm"
            - name: ROMM_DB_DRIVER
              value: "postgresql"
            - name: HASHEOUS_API_ENABLED
              value: "true"
            - name: SCAN_WORKERS
              value: "2"
            - name: WEB_SERVER_CONCURRENCY
              value: "3"
          envFrom:
            - secretRef:
                name: romm-secrets
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          volumeMounts:
            - name: resources
              mountPath: /romm/resources
            - name: redis
              mountPath: /redis-data
            - name: assets
              mountPath: /romm/assets
            - name: library
              mountPath: /romm/library/roms
              subPath: tank/media/games
          resources:
            requests:
              memory: 1Gi
              cpu: 500m
            limits:
              memory: 2Gi
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      volumes:
        - name: resources
          persistentVolumeClaim:
            claimName: romm-resources-ceph
        - name: redis
          persistentVolumeClaim:
            claimName: romm-redis-ceph
        - name: assets
          persistentVolumeClaim:
            claimName: romm-assets-ceph
        - name: library
          persistentVolumeClaim:
            claimName: media-pvc
