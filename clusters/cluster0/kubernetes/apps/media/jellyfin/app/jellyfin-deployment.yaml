apiVersion: apps/v1
kind: Deployment
metadata:
  name: jellyfin
  namespace: media
  labels:
    app: jellyfin
spec:
  selector:
    matchLabels:
      app: jellyfin
  template:
    metadata:
      labels:
        app: jellyfin
    spec:
      nodeSelector:
        # worker-02 (Lunar Lake). Its iGPU is driven by xe, not i915, so the
        # GPU resource below must match; see the resources block.
        kubernetes.io/hostname: worker-02
      containers:
        - name: jellyfin
          # Pinned deliberately, and the pin is what puts jellyfin under
          # Renovate at all: Renovate cannot parse a version out of `:latest`,
          # so with that tag it proposed nothing and upgrades instead arrived
          # silently on any pod restart (imagePullPolicy is Always and this
          # pod OOM-restarts often against its 4Gi limit). That is how
          # Jellyfin 12 landed unreviewed, dropping the legacy
          # X-Emby-Authorization header that Ombi still sends and breaking
          # login for every Jellyfin-linked Ombi user plus the content sync
          # (Ombi-app/Ombi#5478, still open upstream). Keep this pinned so
          # upgrades stay opt-in via a reviewable Renovate PR.
          image: jellyfin/jellyfin:12.1
          imagePullPolicy: Always
          ports:
            - containerPort: 8096
              name: jellyfin
          env:
            - name: GID
              value: "1000"
            - name: UID
              value: "1000"
            - name: JELLYFIN_PublishedServerUrl
              value: "https://jellyfin.gregbob.net"
          volumeMounts:
            - name: jellyfin-config
              mountPath: /config
            - name: jellyfin-cache
              mountPath: /cache
            - name: jellyfin-media-pvc
              mountPath: /media
          resources:
            limits:
              gpu.intel.com/xe: "1"
              memory: 4Gi
            requests:
              gpu.intel.com/xe: "1"
              memory: 4Gi
              cpu: "1"
      volumes:
        - name: jellyfin-config
          persistentVolumeClaim:
            claimName: jellyfin-config-ceph
        # Transcode scratch, deliberately NOT a PVC. The previous local-path
        # claim grew to 107 GiB of orphaned segments and filled worker-01's
        # root disk, which put the node in DiskPressure and evicted the Intel
        # GPU plugin, taking jellyfin down cluster-wide. local-path does not
        # enforce the PVC's requested size; kubelet DOES enforce an emptyDir
        # sizeLimit and evicts the pod if it is exceeded. This matters more on
        # worker-02, whose 150G root shares a spindle with the Ceph OSD LV.
        - name: jellyfin-cache
          emptyDir:
            sizeLimit: 40Gi
        - name: jellyfin-media-pvc
          persistentVolumeClaim:
            claimName: media-pvc
