apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: prowlarr
  name: prowlarr
  namespace: media
spec:
  template:
    metadata:
      labels:
        app: prowlarr
    spec:
      nodeSelector:
        kubernetes.io/hostname: control-00
      containers:
        # Pinned so upgrades are opt-in, and the pin is what puts prowlarr under
        # Renovate at all: Renovate cannot parse a version out of `:latest`, so
        # with that tag it proposed nothing and new builds instead arrived
        # silently on any pod restart (imagePullPolicy is Always). Use the full
        # X.Y.Z.BUILD-lsNNN build tag; the bare 2.6.5 alias is republished on
        # every build of that minor, so it floats. Pulled from Docker Hub, not
        # ghcr.io or lscr.io (a redirect in front of GHCR): Renovate's GHCR
        # lookups are anonymous, and listing linuxserver's ~16k prowlarr tags
        # hits GHCR's 429 on a large share of runs, so the lookup returned
        # no-result and the media-apps branch was deleted before it became a
        # PR. Docker Hub serves the same digest.
        - image: docker.io/linuxserver/prowlarr:2.6.5.5623-ls161
          imagePullPolicy: Always
          name: prowlarr
          env:
          - name: TZ
            value: "America/Detroit"
          - name: PUID
            value: "1000"
          - name: PGID
            value: "1000"
          ports:
          - name: prowlarr-port
            containerPort: 9696
            protocol: TCP
          volumeMounts:
          - name: prowlarr-config
            mountPath: /config
          resources:
            requests:
              memory: 2Gi
              cpu: 500m
            limits:
              memory: 2Gi
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      volumes:
      - name: prowlarr-config
        persistentVolumeClaim:
          claimName: "prowlarr-config-ceph"
  selector:
    matchLabels:
      app: prowlarr
