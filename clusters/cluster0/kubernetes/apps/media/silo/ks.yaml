---
# silo.gregbob.net: Silo (self-hosted media server).
# No gateway-level SSO here (listenarr keeps its own): Silo does its own
# authentication with local accounts, and its native phone/TV apps cannot
# pass a cookie-based ext-auth gate. They probe unauthenticated API
# endpoints before signing in, and the gateway 302 to the IdP broke that
# with "Enter a valid server address". Silo's own sign-in and session
# auth are the access boundary; the route is HTTPS-only.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app silo
  namespace: flux-system
spec:
  dependsOn:
    # The shared media library volume.
    - name: media-storage
    # The silo database (cnpg-silo cluster + silo Database).
    - name: cnpg-databases
  targetNamespace: media
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  path: ./clusters/cluster0/kubernetes/apps/media/silo/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: false
  interval: 3m
  retryInterval: 1m
  timeout: 2m
