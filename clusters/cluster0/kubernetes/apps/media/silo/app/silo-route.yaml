---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: silo
  namespace: media
spec:
  hostnames:
  - silo.gregbob.net
  parentRefs:
  - name: wildcard-gregbob-net
    namespace: network
  rules:
  - backendRefs:
    - name: silo-service
      port: 8080
    matches:
    - path:
        type: PathPrefix
        value: /
