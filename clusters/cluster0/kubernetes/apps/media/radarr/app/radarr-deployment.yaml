apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: radarr
  name: radarr
  namespace: media
spec:
  template:
    metadata:
      labels:
        app: radarr
    spec:
      nodeSelector:
        kubernetes.io/hostname: control-00
      containers:
        # Pinned so upgrades are opt-in, and the pin is what puts radarr under
        # Renovate at all: Renovate cannot parse a version out of `:latest`, so
        # with that tag it proposed nothing and new builds instead arrived
        # silently on any pod restart (imagePullPolicy is Always). Use the full
        # X.Y.Z.BUILD-lsNNN build tag; the bare 6.4.4 alias is republished on
        # every build of that minor, so it floats.
        - image: lscr.io/linuxserver/radarr:6.4.4.10685-ls318
          imagePullPolicy: Always
          name: radarr
          env:
          - name: TZ
            value: "America/Detroit"
          - name: PUID
            value: "1000"
          - name: PGID
            value: "1000"
          ports:
          - name: radarr-port
            containerPort: 7878
            protocol: TCP
          volumeMounts:
          - name: radarr-config
            mountPath: /config
          - name: radarr-media
            mountPath: /movies
          resources:
            requests:
              memory: 3Gi
              cpu: 500m
            limits:
              memory: 3Gi
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      volumes:
      - name: radarr-config
        persistentVolumeClaim:
          claimName: "radarr-config-ceph"
      - name: radarr-media
        persistentVolumeClaim:
          claimName: "media-pvc"
  selector:
    matchLabels:
      app: radarr
