apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: sabnzbd
  name: sabnzbd
  namespace: media
spec:
  template:
    metadata:
      labels:
        app: sabnzbd
    spec:
      nodeSelector:
        kubernetes.io/hostname: control-00
      containers:
        # Pinned so upgrades are opt-in; with `:latest` Renovate saw no
        # dependency and new builds arrived on any pod restart. Use the full
        # X.Y.Z-lsNNN build tag (the bare 5.1.3 alias is republished per build,
        # and the newest tags are unstable/nightly builds). Docker Hub rather
        # than lscr.io/ghcr.io, whose anonymous lookups 429 in Renovate.
        - image: docker.io/linuxserver/sabnzbd:5.1.3-ls278
          imagePullPolicy: Always
          name: sabnzbd
          env:
            - name: TZ
              value: "America/Detroit"
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
          ports:
            - name: sabnzbd-port-1
              containerPort: 8080
              protocol: TCP
            - name: sabnzbd-port-2
              containerPort: 9090
              protocol: TCP
          volumeMounts:
            - name: sabnzbd-config
              mountPath: /config
            - name: sabnzbd-media
              mountPath: /downloads
            - name: sabnzbd-scratch
              mountPath: /scratch
          resources:
            requests:
              memory: 3Gi
              cpu: 500m
            limits:
              memory: 3Gi
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      volumes:
        - name: sabnzbd-config
          persistentVolumeClaim:
            claimName: "sabnzbd-config-ceph"
        - name: sabnzbd-media
          persistentVolumeClaim:
            claimName: "media-pvc"
        - name: sabnzbd-scratch
          persistentVolumeClaim:
            claimName: "scratch-pvc"
  selector:
    matchLabels:
      app: sabnzbd
