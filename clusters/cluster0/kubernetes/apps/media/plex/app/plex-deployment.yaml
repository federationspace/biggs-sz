apiVersion: apps/v1
kind: Deployment
metadata:
  name: plex
  namespace: media
  labels:
    app: plex
spec:
  # Stop the old pod before starting the new one. A single replica pinned to
  # worker-01 cannot surge a second 6Gi pod onto that node (it lacks the
  # memory), and the RWO ceph-block config volume cannot attach to two pods,
  # so the default 25% surge deadlocks every rollout. This is Recreate in
  # effect; type: Recreate itself is rejected by server-side apply because
  # the API-defaulted rollingUpdate block has no field owner to clear it.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: plex
  template:
    metadata:
      labels:
        app: plex
    spec:
      nodeSelector:
        # worker-01 is Raptor Lake and uses the i915 driver, so the
        # gpu.intel.com/i915 request below stays correct.
        kubernetes.io/hostname: worker-01
      containers:
        - name: plex
          image: plexinc/pms-docker:1.43.5.11029-6bf8af3f0
          imagePullPolicy: Always
          ports:
            - containerPort: 32400
              name: plex
          env:
            - name: PGID
              value: "1000"
            - name: PUID
              value: "1000"
            - name: TZ
              value: "America/Detroit"
            - name: PLEX_CLAIM
              value: "claim-s-7mG2r8bjAKzyDdXfw2"
          volumeMounts:
            - name: plex-config
              mountPath: /config
            - name: plex-media-pvc
              mountPath: /media
          resources:
            limits:
              gpu.intel.com/i915: "1"
              memory: 6Gi
            requests:
              gpu.intel.com/i915: "1"
              memory: 6Gi
              cpu: "1"
      volumes:
        - name: plex-config
          persistentVolumeClaim:
            claimName: plex-config-ceph
        - name: plex-media-pvc
          persistentVolumeClaim:
            claimName: media-pvc
