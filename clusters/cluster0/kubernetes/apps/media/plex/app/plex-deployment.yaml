apiVersion: apps/v1
kind: Deployment
metadata:
  name: plex
  namespace: media
  labels:
    app: plex
spec:
  selector:
    matchLabels:
      app: plex
  template:
    metadata:
      labels:
        app: plex
    spec:
      nodeSelector:
        # worker-01 is Raptor Lake and uses the i915 driver, so the
        # gpu.intel.com/i915 request below stays correct.
        kubernetes.io/hostname: worker-01
      containers:
        - name: plex
          image: plexinc/pms-docker:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 32400
              name: plex
          env:
            - name: PGID
              value: "1000"
            - name: PUID
              value: "1000"
            - name: TZ
              value: "America/Detroit"
            - name: PLEX_CLAIM
              value: "claim-s-7mG2r8bjAKzyDdXfw2"
          volumeMounts:
            - name: plex-config
              mountPath: /config
            - name: plex-media-pvc
              mountPath: /media
          resources:
            limits:
              gpu.intel.com/i915: "1"
              memory: 10Gi
            requests:
              gpu.intel.com/i915: "1"
              memory: 10Gi
              cpu: "1"
      volumes:
        - name: plex-config
          persistentVolumeClaim:
            claimName: plex-config-ceph
        - name: plex-media-pvc
          persistentVolumeClaim:
            claimName: media-pvc
