apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: homarr-oidc
  namespace: media
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    creationPolicy: Owner
  data:
  - secretKey: client-id
    remoteRef:
      key: "homarr-oidc"
      property: client-id
  - secretKey: client-secret
    remoteRef:
      key: "homarr-oidc"
      property: client-secret
