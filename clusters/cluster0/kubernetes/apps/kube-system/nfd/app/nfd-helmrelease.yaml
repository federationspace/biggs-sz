apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: node-feature-discovery
  namespace: kube-system
spec:
  interval: 3m
  chart:
    spec:
      chart: node-feature-discovery
      version: 0.18.1
      sourceRef:
        kind: HelmRepository
        name: node-feature-discovery
        namespace: flux-system
  values:
    worker:
      # Let the NFD worker label the tainted GPU node ai-00 too.
      tolerations:
        - key: amd.com/gpu
          operator: Exists
          effect: NoSchedule
