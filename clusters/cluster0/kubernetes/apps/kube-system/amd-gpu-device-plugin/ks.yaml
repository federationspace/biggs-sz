---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app amd-gpu-device-plugin
  namespace: flux-system
spec:
  targetNamespace: kube-system
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  path: ./clusters/cluster0/kubernetes/apps/kube-system/amd-gpu-device-plugin/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  # wait: true so the Radiance app (PR 2) can dependsOn this Kustomization
  # and only start once the plugin advertises the GPUs.
  wait: true
  interval: 3m
  retryInterval: 1m
  timeout: 5m
