---
# Harness2 workbench dashboard login, managed via External Secrets + 1Password.
#
# 1Password item required (biggs-sz vault): harness2-dashboard, with fields:
#   dashboard-user   -- web dashboard basic-auth username
#   dashboard-pass   -- web dashboard basic-auth password
#   dashboard-secret -- random string for restart-stable dashboard sessions
#                       (e.g. `openssl rand -hex 32`)
#
# Deliberately separate from the bot's hermes-secrets: this dashboard drives
# an agent with a terminal tool on the workbench volume, so it gets its own
# credentials, rotatable on their own.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: harness2-dashboard
  namespace: hermes
  labels:
    app.kubernetes.io/name: harness2
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: harness2-dashboard
    creationPolicy: Owner
    template:
      data:
        HERMES_DASHBOARD_BASIC_AUTH_USERNAME: "{{ .dashboardUser }}"
        HERMES_DASHBOARD_BASIC_AUTH_PASSWORD: "{{ .dashboardPass }}"
        HERMES_DASHBOARD_BASIC_AUTH_SECRET: "{{ .dashboardSecret }}"
  data:
    - secretKey: dashboardUser
      remoteRef:
        key: harness2-dashboard
        property: dashboard-user
    - secretKey: dashboardPass
      remoteRef:
        key: harness2-dashboard
        property: dashboard-pass
    - secretKey: dashboardSecret
      remoteRef:
        key: harness2-dashboard
        property: dashboard-secret
