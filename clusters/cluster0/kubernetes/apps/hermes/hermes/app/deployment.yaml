# Hermes gateway (biggs.dog pattern, ported 2026-11-14). The image's
# entrypoint-dispatch.sh runs the s6 supervision tree that supervises
# `gateway run` + the dashboard (HERMES_DASHBOARD=1) -- NO command override;
# overriding it breaks s6. HERMES_HOME=/opt/data is baked into the image.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes
  namespace: hermes
  labels:
    app.kubernetes.io/name: hermes
spec:
  replicas: 1
  # RWO PVC: never let two pods attach during a rollout.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: hermes
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hermes
    spec:
      hostUsers: false
      automountServiceAccountToken: false
      # CPU-only workload (inference is external). Do NOT pin
      # nvidia.com/gpu.present -- that made other pods unschedulable.
      # Softly prefer non-GPU nodes so Hermes never competes with vLLM/gaming
      # for the GPU node's resources (cluster0 rule; biggs.dog has no
      # affinity, its cluster layout differs).
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/os
                    operator: In
                    values: ["linux"]
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 1
              preference:
                matchExpressions:
                  - key: nvidia.com/gpu.present
                    operator: NotIn
                    values: ["true"]
      containers:
        - name: gateway
          # Custom build from github.com/shrinedogg/hermes-agent branch
          # build/dockerhub-catalog-harness2 @ 4aa78e93 (catalog-harness2
          # tree = upstream main 2026-11-12 sync, e0d4c3a3):
          # 0.23.0-generation core (release base v2026.9.24) + the harness2
          # plugin catalog entry (plugin-catalog/harness2.yaml) + harness2
          # vendored (plugins-vendor/harness2 @ shrinedogg/harness2-hermes
          # 51acf02, the catalog pin) which the image seeds into
          # $HERMES_HOME/plugins on first boot (never overwriting an
          # existing install).
          # Built by GH run 43280215151 on the self-hosted cluster0-hermes
          # runner (2026-11-12, success); digest pinned from the Docker Hub
          # tag manifest (oci image index, amd64). Identical image to
          # hermes.biggs.dog (biggs.dog cluster1).
          image: docker.io/shrinedogg/hermes-agent:catalog-harness2-4aa78e9@sha256:6c1549f62fd65e036099c88c85a121c344fac938cb10fb4207bd53616a68ff60
          env:
            # Dashboard on, bound 0.0.0.0 by image default; public URL pinned
            # so the OIDC redirect URI = https://hermes.gregbob.net/auth/callback.
            - name: HERMES_DASHBOARD
              value: "1"
            - name: HERMES_DASHBOARD_PUBLIC_URL
              value: "https://hermes.gregbob.net"
            # PocketID at id.gregbob.net (cluster0 equivalent of biggs.dog's
            # id.biggs.dog). Confidential client: id + secret come from the
            # hermes-gateway secret (envFrom); the self-hosted OIDC provider
            # layers the secret on top of PKCE.
            - name: HERMES_DASHBOARD_OIDC_ISSUER
              value: "https://id.gregbob.net"
            # biggs.dog deltas dropped here: OBSIDIAN_VAULT_PATH (no vault
            # clone -- the vault is a local Mac directory, not a git repo)
            # and no vault-clone init container. Matrix credentials come from
            # the hermes-gateway secret (envFrom), 1:1 with the migrated
            # laptop .env key names.
          envFrom:
            - secretRef:
                name: hermes-gateway
          ports:
            - name: http-dashboard
              containerPort: 9119
              protocol: TCP
          # tcpSocket probes: every /api/ route is session-token gated, so an
          # HTTP probe would fight the auth gate; s6 restarts the gateway if
          # the process dies, liveness only catches a wedged listener.
          readinessProbe:
            tcpSocket:
              port: http-dashboard
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http-dashboard
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 5
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["SETUID", "SETGID", "CHOWN", "DAC_OVERRIDE"]
            seccompProfile:
              type: RuntimeDefault
          # NOTE: image boots as root and drops privileges in the entrypoint
          # (s6 + setuid), so runAsNonRoot is NOT set (would break boot).
          # Boot contract for the pinned image (hermes-agent v2026.9.24 base;
          # all caps PSA-baseline-legal, verified vs k8s v1.36.0 -- same
          # contract as hermes.biggs.dog, accepted 2026-11-07 there):
          #   SETUID/SETGID - s6 entrypoint drops root -> hermes (setuidgid)
          #   CHOWN         - stage2 hands /opt/data (PVC) to hermes and the
          #                   supervise-perms hook grants hermes access to the
          #                   supervise/ trees s6 creates root-owned under /run
          #   DAC_OVERRIDE  - root s6-supervise/s6-svlisten operate the
          #                   hermes-owned trees and PVC state
          # Tradeoff: container root can bypass file perms on mounted volumes
          # (can read hermes-owned 0600 runtime state). Accepted 2026-11-14
          # for this single-user cluster, same as hermes.biggs.dog.
          volumeMounts:
            - name: data
              mountPath: /opt/data
            - name: tmp
              mountPath: /tmp
            - name: run
              mountPath: /run
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: hermes-data
        - name: tmp
          emptyDir: {}
        - name: run
          emptyDir: {}
