---
# Base Hermes config -- Git is the source of truth for non-secret settings.
# An init container (see deployment.yaml) copies these into /opt/data on every
# boot, OVERWRITING config.yaml/SOUL.md so the declared config always wins.
# Agent-managed state (memories/, sessions/, skills/, cron/) lives on the PVC
# and is NEVER touched by the seed, so it persists across restarts and upgrades.
#
# Secrets and platform wiring are NOT here. Per the Hermes docs, the Matrix
# adapter is driven by ENVIRONMENT VARIABLES (MATRIX_*), injected from the
# hermes-secrets ExternalSecret + a plain MATRIX_HOMESERVER env in the
# Deployment. The model provider is a NAMED CUSTOM provider (providers.nous)
# that reads the Nous Portal key from the NOUS_API_KEY env var (mounted from
# hermes-secrets via envFrom), so the secret never lives in config.yaml.
# config.yaml here holds only the non-secret provider wiring + model selection.
apiVersion: v1
kind: ConfigMap
metadata:
  name: hermes-config
  namespace: hermes
  labels:
    app.kubernetes.io/name: hermes
data:
  config.yaml: |
    # Model backend: Nous Portal (OpenAI-compatible; routes to frontier models
    # from many labs under a single API key + credit balance). Independent of
    # the in-cluster vLLM, which is scaled to 0 during Wolf gaming sessions.
    #
    # The provider is a named CUSTOM provider, not the built-in `nous` one:
    # the built-in nous path requires an OAuth-minted agent_key (invoke JWT),
    # which a statically-seeded API key never satisfies, so it failed with
    # "not logged into Nous Portal". A custom provider consumes a static API
    # key directly (chat_completions). key_env points at the NOUS_API_KEY env
    # var (from hermes-secrets via envFrom); the key is NOT stored here.
    # MAINTAINER-TUNABLE: pick any model from the Portal catalog; names follow
    # the OpenRouter convention (vendor/model-id).
    #
    # Default is the strongest FREE Portal model: Reflection Beam 1.0 (501B
    # MoE, 23B active; Artificial Analysis Intelligence Index 30, the highest
    # published score among the Portal's freeRecommendedModels as of
    # 2026-10-21). The ":free" suffix is what keeps it at zero cost; dropping
    # it bills the paid variant. Free variants can be retired without notice
    # (some carry an expiration_date in /v1/models), so if the bot starts
    # failing with "model not found", re-pick from the Portal's free list.
    model:
      default: reflection/beam-1.0-501b-a23b:free
      # The Portal's /v1/models doesn't expose a context length Hermes can
      # read for this model, so it guessed 256K and logged a warning. The
      # real Portal limit is 262144 (top_provider.context_length).
      context_length: 262144
      # "custom:nous" (not bare "nous"): bare "nous" is shadowed by the built-in
      # nous provider (which demands an OAuth agent_key and fails with "not
      # logged in"). The "custom:<name>" form resolves to the providers.nous
      # block below and consumes the static NOUS_API_KEY via chat_completions.
      provider: custom:nous

    providers:
      nous:
        name: nous
        base_url: https://inference-api.nousresearch.com/v1
        key_env: NOUS_API_KEY
        api_mode: chat_completions

    # Unattended gateway: enable the tool-loop circuit breaker the Docker docs
    # explicitly recommend for server/gateway deploys (default is off, which
    # only warns -- not enough when no human is watching).
    tool_loop_guardrails:
      hard_stop_enabled: true
      hard_stop_after:
        exact_failure: 5
        idempotent_no_progress: 5

    # Auxiliary (side-job) models: context compression, session titles,
    # curator, memory rewrite, approvals, vision, etc. Left at the default
    # `provider: auto`, every one of these resolves to the BUILT-IN nous
    # provider, which needs an OAuth `hermes model` login this pod does not
    # have; they all failed with "No LLM provider configured". `provider:
    # custom:nous` does not work here either (aux looks for a
    # CUSTOM:NOUS_API_KEY env var). Pointing each task straight at the Portal
    # endpoint with key_env reuses the existing NOUS_API_KEY; no new secret.
    #
    # Text tasks use the same free model as the main agent (Beam 1.0). The
    # compression model's context window must be >= the main model's, which
    # using the same model guarantees. Vision uses Ornith 1.5 122B (free,
    # image input; verified). Step 3.7 Flash, the Portal's advertised free
    # vision model, returns 400 "missing tags" on every request, so it is
    # deliberately not used.
    #
    # The anchors keep the endpoint + key in one place. When the main model
    # changes, update &aux_text's model too.
    auxiliary:
      compression: &aux_text
        base_url: https://inference-api.nousresearch.com/v1
        key_env: NOUS_API_KEY
        model: reflection/beam-1.0-501b-a23b:free
      title_generation: *aux_text
      curator: *aux_text
      background_review: *aux_text
      memory_query_rewrite: *aux_text
      approval: *aux_text
      skills_hub: *aux_text
      mcp: *aux_text
      review: *aux_text
      goal_judge: *aux_text
      monitor: *aux_text
      triage_specifier: *aux_text
      kanban_decomposer: *aux_text
      profile_describer: *aux_text
      tts_audio_tags: *aux_text
      moa_reference: *aux_text
      moa_aggregator: *aux_text
      vision:
        base_url: https://inference-api.nousresearch.com/v1
        key_env: NOUS_API_KEY
        model: ornith/ornith-1.5-122b:free
  SOUL.md: |
    # Hermes -- biggs-sz cluster assistant

    You are the resident agent of the biggs-sz homelab Kubernetes cluster,
    reachable over Matrix at @hermes:gregbob.net. You are helpful, concise,
    and honest about uncertainty.
