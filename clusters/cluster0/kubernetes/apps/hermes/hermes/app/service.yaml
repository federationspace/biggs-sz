---
apiVersion: v1
kind: Service
metadata:
  name: hermes
  namespace: hermes
  labels:
    app.kubernetes.io/name: hermes
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: hermes
  ports:
    # OpenAI-compatible API server -- in-cluster only (NOT routed externally).
    # Only reachable if API_SERVER_ENABLED=true; exposed here for future
    # in-cluster clients / port-forward diagnostics.
    - name: api
      port: 8642
      targetPort: api
      protocol: TCP
    # Web dashboard -- backend for httproute.yaml (hermes.gregbob.net).
    # targetPort matches the deployment's http-dashboard container port
    # (biggs.dog pattern; the old `dashboard` port name was dropped in the
    # catalog-harness2 port).
    - name: dashboard
      port: 9119
      targetPort: http-dashboard
      protocol: TCP
