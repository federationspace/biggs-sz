# Single RWO RBD volume = the migrated ~/.hermes ($HERMES_HOME=/opt/data).
# 30Gi for the ~250MiB migrated durable subset + headroom (logs, uploads,
# future state). Block device (rook RBD) => SQLite WAL-safe.
# Exact port of biggs.dog's pvc.yaml (30Gi, prune-disabled).
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hermes-data
  namespace: hermes
  labels:
    app.kubernetes.io/name: hermes
  # Flux prune protection: this Kustomization keeps prune: true, and
  # ceph-block reclaimPolicy is Delete, so a pruned PVC would delete the RBD
  # and the migrated state. Pattern:
  # clusters/cluster1/kubernetes/apps/renovate/namespace.yaml (biggs.dog).
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ceph-block
  resources:
    requests:
      storage: 30Gi
