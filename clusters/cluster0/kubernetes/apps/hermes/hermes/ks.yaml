---
# Flux Kustomization for the Hermes Agent gateway.
#
# No dependsOn: Hermes is a plain Deployment (not a CRD consumer) and its
# model backend is external (Nous Portal), so it is intentionally un-gated --
# a scale-to-0 of any sibling workload can never block its reconciliation.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app hermes
  namespace: flux-system
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  path: ./clusters/cluster0/kubernetes/apps/hermes/hermes/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
  interval: 3m
  retryInterval: 1m
  timeout: 5m
