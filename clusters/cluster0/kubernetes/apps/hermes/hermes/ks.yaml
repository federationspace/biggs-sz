---
# Flux Kustomization for the Hermes Agent gateway.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app hermes
  namespace: flux-system
spec:
  dependsOn:
    # ClusterSecretStore (onepassword-connect) must exist for the ExternalSecret.
    - name: secretstore
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  path: ./clusters/cluster0/kubernetes/apps/hermes/hermes/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
  interval: 3m
  retryInterval: 1m
  timeout: 5m
