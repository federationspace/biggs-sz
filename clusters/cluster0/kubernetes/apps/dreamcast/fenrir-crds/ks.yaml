---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: fenrir-crds
  namespace: flux-system
spec:
  interval: 3m
  retryInterval: 1m
  sourceRef:
    kind: GitRepository
    name: fenrir
  path: "./crds"
  # CRD kustomizations stay unpruned (repo convention): deleting the
  # fenrir source must not delete CRDs with live Session/Stream objects.
  prune: false
  wait: false
  timeout: 2m
  force: true
