---
# LiveKit API key/secret come from 1Password, NOT the ConfigMap (unlike the
# biggs.dog reference, which hardcodes the pair in livekit.yaml).
#
# PREREQUISITE: the 1Password vault `biggs-sz` must contain an item
# `livekit-credentials` with fields `key` and `secret` (exact lowercase; they
# match the remoteRef.property below). Until that item exists, this ExternalSecret
# stays OutOfSync and the SFU + lk-jwt pods come up without credentials.
#
# ESO v0.20 has no spec.template / templateEngine, so the two 1Password fields
# surface as two separate Secret keys (LIVEKIT_KEY, LIVEKIT_SECRET). The SFU
# binary does not read those directly: it takes a single `keys` entry
# ("key: secret"). The Deployment composes it from the two envs at startup
# (see livekit-deployment.yaml). lk-jwt-service reads the two envs natively.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: livekit-credentials
  namespace: livekit
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    creationPolicy: Owner
    name: livekit-credentials
  data:
    - secretKey: LIVEKIT_KEY
      remoteRef:
        key: livekit-credentials
        property: key
    - secretKey: LIVEKIT_SECRET
      remoteRef:
        key: livekit-credentials
        property: secret
