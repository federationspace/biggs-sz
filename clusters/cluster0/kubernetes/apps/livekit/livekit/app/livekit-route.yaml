---
# livekit.gregbob.net signaling route on the shared wildcard gateway.
#
# One hostname, path-split across the two backends (same pattern as the
# biggs.dog reference and lk-jwt-service's own endpoint set):
#   /sfu/get, /get_token, /healthz -> lk-jwt-service:8081  (MatrixRTC auth)
#   everything else (WS media signaling, /twrpc, /) -> livekit-service:7880
#
# parentRefs by name only, no sectionName (biggs-sz convention; the wildcard
# gateway's *.gregbob.net https listener + wildcard cert already covers this
# hostname).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: livekit-route
  namespace: livekit
  labels:
    app.kubernetes.io/name: livekit
spec:
  hostnames:
    - livekit.gregbob.net
  parentRefs:
    - name: wildcard-gregbob-net
      namespace: network
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /sfu/get
      backendRefs:
        - name: lk-jwt-service
          port: 8081
    - matches:
        - path:
            type: PathPrefix
            value: /get_token
      backendRefs:
        - name: lk-jwt-service
          port: 8081
    - matches:
        - path:
            type: PathPrefix
            value: /healthz
      backendRefs:
        - name: lk-jwt-service
          port: 8081
    - backendRefs:
        - name: livekit-service
          port: 7880
