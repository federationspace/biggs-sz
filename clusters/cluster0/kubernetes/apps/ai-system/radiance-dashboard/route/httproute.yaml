---
# radiance.gregbob.net -> Radiance (dashboard at /, plus the data endpoints
# it polls), through the same AgentgatewayBackend as llm.gregbob.net, so the
# gateway supplies the engine key. Guarded by radiance-dashboard-sso
# (../auth). API clients keep using llm.gregbob.net with a client token.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: radiance-dashboard
  namespace: ai-system
spec:
  hostnames:
    - radiance.gregbob.net
  parentRefs:
    - name: wildcard-gregbob-net
      namespace: network
  rules:
    - backendRefs:
        - name: radiance
          group: agentgateway.dev
          kind: AgentgatewayBackend
      matches:
        - path:
            type: PathPrefix
            value: /
