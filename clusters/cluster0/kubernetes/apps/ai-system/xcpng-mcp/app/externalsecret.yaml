---
# Materializes Secret xcpng-mcp-token (key: token), read by the bridge as
# XO_TOKEN. 1Password item xo-api-token (vault biggs-sz), CONCEALED field
# label `token`. Until the item exists the ESO stays OutOfSync and the pod
# stays CreateContainerConfigError; both clear when the item lands. The
# Kustomization deliberately has no healthCheckExprs for this (that would
# block the whole app until the prerequisite item is created).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: xcpng-mcp-token
  namespace: ai-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: xcpng-mcp-token
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: xo-api-token
        property: token
