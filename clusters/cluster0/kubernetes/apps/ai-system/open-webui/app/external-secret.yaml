---
# Materializes Secret "open-webui-secrets", read by the Open WebUI Deployment.
#
# 1Password items (vault biggs-sz):
#   - open-webui
#       client-id      Client ID of the Pocket ID OIDC client "Open WebUI"
#                      (callback https://chat.gregbob.net/oauth/oidc/login/callback).
#       client-secret  That client's secret.
#       secret-key     Signs Open WebUI's session tokens; `openssl rand -hex 32`.
#                      Rotating it signs everyone out.
#   - radiance (api-key): the engine key, for the in-cluster connection to
#     Radiance (same item the engine reads).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: open-webui-secrets
  namespace: ai-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: open-webui-secrets
    creationPolicy: Owner
  data:
    - secretKey: OAUTH_CLIENT_ID
      remoteRef:
        key: open-webui
        property: client-id
    - secretKey: OAUTH_CLIENT_SECRET
      remoteRef:
        key: open-webui
        property: client-secret
    - secretKey: WEBUI_SECRET_KEY
      remoteRef:
        key: open-webui
        property: secret-key
    - secretKey: OPENAI_API_KEY
      remoteRef:
        key: radiance
        property: api-key
