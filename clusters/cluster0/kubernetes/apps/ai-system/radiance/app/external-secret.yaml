---
# Materializes Secret "radiance-secrets", read by the Radiance Deployment.
#
# 1Password items (vault biggs-sz):
#   - radiance (api-key): the engine's own API key (--api-key-env). Also used
#     by agentgateway to call the engine (agentgateway-ai/secrets).
#   - huggingface (token): a Hugging Face read token for the model fetch.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: radiance-secrets
  namespace: ai-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: radiance-secrets
    creationPolicy: Owner
  data:
    - secretKey: RADIANCE_API_KEY
      remoteRef:
        key: radiance
        property: api-key
    - secretKey: HF_TOKEN
      remoteRef:
        key: huggingface
        property: token
