---
# Radiance (codeberg.org/StillDeadcode/radiance), an LLM engine for AMD GPUs,
# serving an OpenAI-compatible API on :8000 across both R9700s (TP=2).
# Ported from the engine's deploy/compose/common.yaml + the per-model file:
#
#   compose                         here
#   network_mode: host              pod network + ClusterIP Service; binds
#                                   0.0.0.0 (cluster0 is IPv4-only, so not ::)
#   user 1000:1000 + render/video   runAsUser/runAsGroup 1000, supplementalGroups
#                                   44 (video) + 993 (render), ai-00's GIDs
#   devices /dev/kfd, /dev/dri      amd.com/gpu-ai-pro-r9700: 2 (the plugin
#                                   mounts /dev/kfd + only the R9700s' nodes)
#   seccomp=unconfined              seccompProfile Unconfined
#   ulimits memlock -1              no k8s field: LimitMEMLOCK=infinity drop-in
#                                   on ai-00's k3s-agent.service (verified)
#   init: true                      none; the engine handles SIGTERM itself
#   stop_grace_period 60s           40s, below the game sessions' 45 s wait for
#                                   VRAM, so the kill backstop lands first
#   /models:ro                      rw PVC: the current model is pre-fetched
#                                   onto it (see ks.yaml); rw stays so the
#                                   engine's owner/name fetch path still works
#   healthcheck, start_period 15m   startupProbe /health, 60 min budget (a big
#                                   model load)
#
# 2.x reads every setting from one YAML file: app/configmap.yaml, mounted at
# /etc/radiance/radiance.yaml; the args are exactly `--config` and that path.
# Started with a 1.x flag list the engine refuses and prints the equivalent
# file. The model knobs are the postBuild.substitute block in ks.yaml; the
# annotation radiance.biggs.sz/config below is built from the same
# variables, so a knob change rewrites the pod template and rolls this
# Deployment (a ConfigMap change alone would not).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: radiance
  namespace: ai-system
  labels:
    app: radiance
spec:
  # replicas is intentionally OMITTED: dreamcast/gpu-arbiter-instance owns the
  # count, scaling Radiance to 0 while a game session pod exists and back to 1
  # after. Declaring it here makes Flux scale Radiance back up mid-session on
  # every reconcile (interval 3m). Unmanaged, a Deployment defaults to 1.
  # To keep Radiance off for a while, suspend this Kustomization AND scale to
  # 0 with --field-manager=flux-client-side-apply on the suspend; a plain
  # kubectl patch of suspend is stripped by the next flux-system reconcile.
  # Never two pods holding the GPUs. New object, so Recreate is accepted
  # (switching an existing Deployment to it is rejected by server-side apply).
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: radiance
  template:
    metadata:
      labels:
        app: radiance
      annotations:
        # Roll trigger; nothing reads it. Built from the same
        # postBuild.substitute variables as configmap.yaml, so any knob
        # change rewrites the pod template, and only template changes roll a
        # Deployment. Keep it in sync with the knob set in ks.yaml.
        radiance.biggs.sz/config: "${RADIANCE_MODEL}|${RADIANCE_SERVED_NAME}|${RADIANCE_TP}|${RADIANCE_MAX_NUM_SEQS}|${RADIANCE_MAX_MODEL_LEN}|${RADIANCE_KV_CACHE_DTYPE}|${RADIANCE_GPU_HEADROOM_MIB}|${RADIANCE_MAX_NUM_BATCHED_TOKENS}"
    spec:
      nodeSelector:
        kubernetes.io/hostname: ai-00
      tolerations:
        - key: amd.com/gpu
          operator: Exists
          effect: NoSchedule
      terminationGracePeriodSeconds: 40
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        supplementalGroups: [44, 993]
        seccompProfile:
          type: Unconfined
      containers:
        - name: radiance
          # Docker Hub stilldeadcode/radiance 2.3.0, linux/amd64 platform
          # manifest (the tag is an OCI index). Fast-moving image: re-pin on
          # engine updates, never run :latest.
          image: docker.io/stilldeadcode/radiance:2.3.0@sha256:1e0fe6a2c310e483e9e66e8446ba274ee767f06044f6761ababd593d7517af12
          imagePullPolicy: IfNotPresent
          args:
            # 2.x takes no 1.x flags; the one file holds every setting.
            - --config
            - /etc/radiance/radiance.yaml
          env:
            - name: RADIANCE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: radiance-secrets
                  key: RADIANCE_API_KEY
            # Read by the engine when a model is given as an owner/name repo
            # id; the models are public, so this only lifts the anonymous
            # rate limit (and covers gated repos).
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: radiance-secrets
                  key: HF_TOKEN
          ports:
            - name: http
              containerPort: 8000
          resources:
            requests:
              amd.com/gpu-ai-pro-r9700: "2"
              cpu: "4"
              memory: 16Gi
            limits:
              amd.com/gpu-ai-pro-r9700: "2"
              memory: 24Gi
          # /health and /ping are the same handler and need no API key. The
          # server listens only after the model is loaded, answers 503 while
          # stopping, and after 60 s of a stuck device ends the process
          # (scheduler.stuck-exit default) so a restart brings it back.
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 360
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /ping
              port: http
            periodSeconds: 10
            failureThreshold: 6
          volumeMounts:
            - name: models
              mountPath: /models
            - name: config
              mountPath: /etc/radiance
              readOnly: true
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: radiance-models
        - name: config
          configMap:
            name: radiance
