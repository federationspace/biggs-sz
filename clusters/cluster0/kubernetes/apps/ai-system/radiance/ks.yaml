---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app radiance
  namespace: flux-system
spec:
  dependsOn:
    # The ROCm plugin must advertise amd.com/gpu-ai-pro-r9700 first.
    - name: amd-gpu-device-plugin
    # ClusterSecretStore for the ExternalSecret.
    - name: secretstore
  targetNamespace: ai-system
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  path: ./clusters/cluster0/kubernetes/apps/ai-system/radiance/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  # wait: false: a first start loads the model (minutes), which must not hold
  # the Kustomization or anything that depends on it.
  wait: false
  interval: 3m
  retryInterval: 1m
  timeout: 2m
  postBuild:
    substitute:
      # The model knobs, substituted into configmap.yaml's radiance.yaml
      # (radiance 2.x reads every setting from that one file; the Deployment
      # args are exactly --config /etc/radiance/radiance.yaml). Changing a
      # knob rewrites the Deployment's radiance.biggs.sz/config annotation,
      # which is built from these same variables, and rolls it.
      #
      # Unlike the 1.x args, the values carry NO inner quotes: the text lands
      # inside the YAML document the engine parses, where a bare 32 must stay
      # an integer (a "32" would be a string the engine refuses). A value
      # that must stay a string quotes itself in configmap.yaml. The values
      # are still quoted as CR strings, because this is a
      # map-of-strings field.
      #
      # Current: Qwen3.8-27B IQ8R (rotated int8) + DFlash2 drafter, vision
      # (29 GiB). It is the 2.x successor of the FP8 container: 2.x serves
      # int8 and bf16 weights only and refuses an FP8 container at startup,
      # and fp8 KV cache is refused by this model (kv-cache-dtype i8). The
      # values are the engine's deploy/compose/tp2.radiance.yaml entry for
      # this exact rig (2x R9700); gpu-headroom 96 and batched 2048 are the
      # engine defaults the 1.x args pinned. i8 tokens cost more memory than
      # the old cache, so the startup log's kv: line must back 100% of
      # max-num-seqs at max-model-len or one of the two comes down.
      #
      # RADIANCE_MODEL is the .rad path on the PVC, not the repo id: the file
      # is pre-fetched onto radiance-models before the image bump merges
      # (one-off pod on ai-00 mounting the PVC, `curl -C -` in a loop with
      # no --retry, then sha256sum against the HF listing's LFS oid). A path
      # takes no model-revision; that key pins a repo id to a hub revision.
      #
      # Every ${RADIANCE_*} variable used in the app manifests must appear
      # here AND in the Deployment's radiance.biggs.sz/config annotation, or
      # a change to it will not roll the Deployment.
      RADIANCE_MODEL: "/models/StillDeadcode/qwen3.8-27b-iq8r-dflash/qwen3.8-27b-iq8r-dflash.rad"
      RADIANCE_SERVED_NAME: "local"
      RADIANCE_TP: "2"
      RADIANCE_MAX_NUM_SEQS: "32"
      RADIANCE_MAX_MODEL_LEN: "200000"
      RADIANCE_KV_CACHE_DTYPE: "i8"
      RADIANCE_GPU_HEADROOM_MIB: "96"
      RADIANCE_MAX_NUM_BATCHED_TOKENS: "2048"
