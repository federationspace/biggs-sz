---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app radiance
  namespace: flux-system
spec:
  dependsOn:
    # The ROCm plugin must advertise amd.com/gpu-ai-pro-r9700 first.
    - name: amd-gpu-device-plugin
    # ClusterSecretStore for the ExternalSecret.
    - name: secretstore
  targetNamespace: ai-system
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  path: ./clusters/cluster0/kubernetes/apps/ai-system/radiance/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  # wait: false: a first start downloads the model (minutes to an hour), which
  # must not hold the Kustomization or anything that depends on it.
  wait: false
  interval: 3m
  retryInterval: 1m
  timeout: 2m
  postBuild:
    substitute:
      # The model knob. Changing these rolls the Deployment; the engine fetches
      # the named Hugging Face repo into the radiance-models PVC on start
      # (resumable, manifest-verified) and serves it under the stable id
      # `local`, so clients never change. Each model's flags come from the
      # engine repo's deploy/compose/<model>.yaml; flags a model does not set
      # take the engine default written here (gpu-headroom 96, batched 2048).
      #
      # Current: Qwen3.8-27B FP8 + DFlash2 drafter (28.7 GiB), flags from the
      # engine's deploy/compose/qwen3.8-27b-fp8.yaml. Chosen over the MXFP4
      # file (FP8 holds up better in practice, same speed); the IQ8R+DFlash2
      # successor (StillDeadcode/qwen3.8-27b-iq8r-dflash) needs a radiance
      # release after 1.17.0, so move to it once the image is bumped.
      # Batched tokens and gpu-headroom take the engine defaults (2048, 96).
      #
      # Every value carries its own double quotes ('"..."'). Flux substitutes
      # AFTER kustomize has re-serialized the manifests, and kustomize writes
      # the "${VAR}" placeholders out unquoted, so a bare 2 would land as an
      # integer and container args must be strings (the apply is rejected).
      # Keep the inner quotes on every value, numbers and hex revisions alike.
      RADIANCE_MODEL: '"StillDeadcode/qwen3.8-27b-fp8"'
      RADIANCE_MODEL_REVISION: '"edd43fda378af6b3b5e8981b6e936145be9608fd"'
      RADIANCE_SERVED_NAME: '"local"'
      RADIANCE_TP: '"2"'
      RADIANCE_MAX_NUM_SEQS: '"32"'
      RADIANCE_MAX_MODEL_LEN: '"200000"'
      RADIANCE_KV_CACHE_DTYPE: '"fp8"'
      RADIANCE_GPU_HEADROOM_MIB: '"96"'
      RADIANCE_MAX_NUM_BATCHED_TOKENS: '"2048"'
