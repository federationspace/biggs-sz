---
# RustFS (S3-compatible object store bundled by the substrate chart) admin
# credentials. The chart hardcodes rustfsadmin/rustfsadmin (its defaults) as
# plaintext env on the rustfs Deployment, the atelet DaemonSet, and the
# rustfs-bucket-init Job, with no auth boundary — any compromised pod that can
# reach the RustFS API could read or replace actor snapshots and the runsc
# binary the privileged atelet loads on the host. Instead, generate real
# credentials out-of-band and materialize them here; the substrate HelmRelease
# post-renderer rewrites every consumer's env to pull from this Secret, and the
# in-repo runsc-cache DaemonSet references it too.
#
# 1Password item required (biggs-sz vault): rustfs-credentials
#   access-key — a random access key id (NOT "rustfsadmin")
#   secret-key — a random secret access key (NOT "rustfsadmin")
# Rotate the defaults: after this lands, the RustFS server comes up with the
# NEW credentials, so the old rustfsadmin/rustfsadmin no longer works.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rustfs-credentials
  namespace: ai-system
  labels:
    app.kubernetes.io/name: rustfs
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: rustfs-credentials
    creationPolicy: Owner
  data:
    - secretKey: access-key
      remoteRef:
        key: rustfs-credentials
        property: access-key
    - secretKey: secret-key
      remoteRef:
        key: rustfs-credentials
        property: secret-key
