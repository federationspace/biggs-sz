---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: substrate
  namespace: ai-system
spec:
  interval: 3m
  chartRef:
    kind: OCIRepository
    name: substrate
    namespace: flux-system
  postRenderers:
    - kustomize:
        patches:
          # Pin every substrate Deployment to the GPU node (nv-01).
          - target:
              kind: Deployment
            patch: |-
              - op: add
                path: /spec/template/spec/nodeSelector
                value:
                  nvidia.com/gpu.present: "true"
          # STEP 1 (connection): the chart does NOT pass --ateapi-conn-spec, so
          # the ate-controller binary dials its hardcoded default
          # dns:///api.ate-system.svc:443 (upstream's namespace). This cluster
          # runs substrate in ai-system, so that name is NXDOMAIN and every
          # golden-actor RPC failed with "name resolver error: produced zero
          # addresses". The chart sets --ateapi-server-name (TLS SNI) with the
          # namespace but omits the dial address.
          - target:
              kind: Deployment
              name: ate-controller
            patch: |-
              - op: add
                path: /spec/template/spec/containers/0/args/-
                value: "--ateapi-conn-spec=dns:///api.ai-system.svc:443"
          # STEP 2 (auth): the kube-apiserver --service-account-issuer is Omni's
          # KubeSpan/SideroLink ULA on the SOURCE cluster, but biggs-sz runs
          # k3s, whose --service-account-issuer is
          # `https://kubernetes.default.svc.cluster.local` (verified by a
          # read-only probe of the target API server). SA tokens carry that as
          # `iss`. ateapi (JWT mode) rejects any token whose `iss` does not match
          # --client-jwt-issuer, so the issuer override below is set to the k3s
          # issuer to match (see values.auth.jwt.issuer). We additionally run a
          # forked ateapi that adds --client-jwt-jwks-url so keys are fetched
          # directly from the reachable in-cluster API rather than via OIDC
          # discovery.
          #
          # STEP 3 (atelet discovery): in v0.0.7, controlapi.AteletInformer()
          # scoped its SharedInformerFactory to a hard-coded
          # `ateletNamespace = "ate-system"` const
          # (cmd/ateapi/internal/controlapi/informer.go) with no flag/override,
          # so it never saw the atelet DaemonSet pods this chart runs in
          # ai-system — the fork carried an ATELET_NAMESPACE patch for this.
          # v0.0.9 UPSTREAMED the fix: AteletInformer now takes the namespace
          # as a parameter and main.go resolves it via
          # installdefaults.NamespaceFromPodEnv(), which reads the standard
          # POD_NAMESPACE downward-API env var (fallback ate-system). The
          # chart already injects POD_NAMESPACE via the downward API, so no
          # override is needed here.
          # VERSION-SKEW (v0.0.9 bump): the rest of the substrate stack
          # (ate-controller, atenet-router, atelet, ateom) is at v0.0.9,
          # whose ate-controller calls CreateAtespace on the Control service.
          # The v0.0.7 fork returned `rpc error: code = Unimplemented desc =
          # unknown method CreateAtespace`, so golden snapshots couldn't be
          # rebuilt and SandboxAgents stuck at Ready=ActorTemplateNotReady.
          # The fork image below is now rebased onto v0.0.9.
          #
          # The old ATELET_NAMESPACE patch is GONE: v0.0.9 upstream replaced
          # the hard-coded `ateletNamespace = "ate-system"` const with
          # installdefaults.NamespaceFromPodEnv(), which reads the standard
          # POD_NAMESPACE downward-API env var (fallback ate-system). The
          # chart already injects POD_NAMESPACE via fieldRef metadata.namespace
          # (ate-api-server.yaml), so it resolves to ai-system automatically —
          # NO env override is needed here.
          #
          # The --client-jwt-jwks-url patch is retained (upstream v0.0.9 still
          # does OIDC discovery against the issuer host, which is Omni's
          # IPv6 ULA, unreachable from the IPv4 pod network). Built from the
          # kagent-dev/substrate v0.0.9 tag + the patches in
          # .wip/substrate-jwks-url/, image build is out of this repo's scope
          # (shrinedogg/ateapi fork).
          - target:
              kind: Deployment
              name: ate-api-server-deployment
            patch: |-
              # Pinned by DIGEST, not tag: the node image cache serves stale
              # content under a mutable tag (imagePullPolicy is IfNotPresent),
              # so a tag reference can run an older build even after the tag is
              # re-pushed. The digest is immutable and forces the correct build.
              # IMPORTANT: the fork MUST track the same substrate version as the
              # ateom/atelet/controller (currently v0.0.10). A v0.0.9 fork against
              # a v0.0.10 ateom corrupts the ateletpb RunRequest/RestoreRequest on
              # the wire (the v0.0.10 proto renumbered fields — added actor_uid=4,
              # shifting spec/sandbox_assets/etc.), which surfaces as
              # "error unmarshalling request: string field contains invalid UTF-8"
              # and pins every SandboxAgent at Ready=ActorTemplateNotReady.
              # Update this digest when the fork image is rebuilt.
              - op: replace
                path: /spec/template/spec/containers/0/image
                value: docker.io/shrinedogg/ateapi@sha256:78d90103f3054bf6544bf3726fa63800a47b970b3425a3e60f4efbfff9bbdad3
              - op: add
                path: /spec/template/spec/containers/0/args/-
                value: "--client-jwt-jwks-url=https://kubernetes.default.svc.cluster.local/openid/v1/jwks"
          # VALKEY cluster-announce-ip: the chart's valkey.conf has NO
          # cluster-announce-* and the StatefulSet has no downward-API env, so
          # each node persists its cluster topology in /data/nodes.conf (PVC)
          # and, on a pod restart that yields a new podIP, re-adopts the STALE
          # persisted address. Every client then dials a dead IP -> i/o timeout,
          # which crashes ate-api-server on startup (eager 'Failed to seed
          # worker cache') and breaks the whole substrate data layer. Setting
          # cluster-announce-ip to the current podIP (downward API) makes nodes
          # always advertise their reachable address, overriding nodes.conf.
          # NOTE: committing this triggers a rolling restart of all 6 valkey
          # pods (podManagementPolicy: Parallel) — do it in a window that
          # tolerates a brief Valkey outage. The one-time operational fix is
          # `CONFIG SET cluster-announce-ip <podIP>` on each node (no restart).
          - target:
              kind: StatefulSet
              name: valkey-cluster
            patch: |-
              - op: add
                path: /spec/template/spec/containers/0/env
                value:
                  - name: POD_IP
                    valueFrom:
                      fieldRef:
                        fieldPath: status.podIP
              - op: add
                path: /spec/template/spec/containers/0/args
                value:
                  - "--cluster-announce-ip"
                  - "$(POD_IP)"
          # ----------------------------------------------------------------
          # RustFS credentials via Secret, not plaintext chart defaults.
          # The chart injects rustfs.accessKey/secretKey (rustfsadmin/
          # rustfsadmin) as LITERAL env values on the rustfs Deployment, the
          # atelet DaemonSet, and the rustfs-bucket-init Job. Rewrite each to a
          # secretKeyRef against the rustfs-credentials Secret (materialized by
          # rustfs-externalsecret.yaml from the biggs-sz vault), so no object-
          # store admin credential is committed to git and the defaults are
          # rotated. The env INDICES below are pinned against the chart at the
          # digest-pinned OCIRepository (helm template of this exact chart:
          # rustfs RUSTFS_ACCESS_KEY=4/RUSTFS_SECRET_KEY=5, atelet
          # AWS_ACCESS_KEY_ID=5/AWS_SECRET_ACCESS_KEY=6, bucket-init
          # AWS_ACCESS_KEY_ID=0/AWS_SECRET_ACCESS_KEY=1); re-verify with
          # `helm template` if the substrate chart version is bumped.
          - target:
              kind: Deployment
              name: rustfs
            patch: |-
              - op: replace
                path: /spec/template/spec/containers/0/env/4
                value:
                  name: RUSTFS_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: rustfs-credentials
                      key: access-key
              - op: replace
                path: /spec/template/spec/containers/0/env/5
                value:
                  name: RUSTFS_SECRET_KEY
                  valueFrom:
                    secretKeyRef:
                      name: rustfs-credentials
                      key: secret-key
          - target:
              kind: DaemonSet
              name: atelet
            patch: |-
              - op: replace
                path: /spec/template/spec/containers/0/env/5
                value:
                  name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: rustfs-credentials
                      key: access-key
              - op: replace
                path: /spec/template/spec/containers/0/env/6
                value:
                  name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: rustfs-credentials
                      key: secret-key
          - target:
              kind: Job
              name: rustfs-bucket-init
            patch: |-
              - op: replace
                path: /spec/template/spec/containers/0/env/0
                value:
                  name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: rustfs-credentials
                      key: access-key
              - op: replace
                path: /spec/template/spec/containers/0/env/1
                value:
                  name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: rustfs-credentials
                      key: secret-key
  # Drift correction: when the chart/values are unchanged, Flux no-ops the helm
  # upgrade, so out-of-band changes (a deleted resource, a `kubectl edit`) silently
  # persist while status stays Ready=True. This is exactly how the valkey-cluster
  # StatefulSet stayed gone after an out-of-band delete, leaving ate-api-server
  # with no Valkey backing. `enabled` makes the controller detect AND correct such
  # drift on every reconcile via a server-side dry-run apply (recreating deleted
  # resources, reverting edits to git state). Aligns with this repo's rule that
  # persistent changes are made in YAML here, not by mutating the cluster.
  driftDetection:
    mode: enabled
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    auth:
      jwt:
        # Equal to the biggs-sz k3s kube-apiserver --service-account-issuer so
        # projected SA tokens' `iss` claim matches ateapi's --client-jwt-issuer
        # check. This is the k3s in-cluster API issuer (the SOURCE cluster's
        # Omni/KubeSpan ULA is NOT used here — biggs-sz runs k3s, and a
        # read-only probe of the target API server returns this exact issuer).
        # It also matches the chart default, so this line is explicit-for-clarity
        # rather than a true override. Key fetch is still redirected via
        # --client-jwt-jwks-url (forked ateapi) at the reachable in-cluster API.
        # Audience is left at the chart default (api.ate-system.svc), which both
        # sides agree on.
        issuer: "https://kubernetes.default.svc.cluster.local"
