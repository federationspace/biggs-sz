---
# runsc-upload — one-time GitOps bootstrap that seeds the gVisor `runsc` binary
# into the RustFS bucket `ate-snapshots` at object key `runsc`.
#
# Why this exists:
#   Nothing else uploads s3://ate-snapshots/runsc. The substrate chart's
#   rustfs-bucket-init Job only CREATES the bucket; the atelet asset fetcher and
#   the runsc-cache DaemonSet both READ this object, and the SandboxConfig
#   (sandboxconfig.yaml) points at it. On a fresh cluster the object is missing,
#   so the cache DaemonSet's copy fails and SandboxAgents never become Ready.
#   This Job fetches the pinned, SHA-256-verified binary from the upstream
#   gVisor release and streams it into RustFS, replacing the manual one-off
#   upload the source cluster relied on.
#
# Idempotent: if the object already exists it exits 0 without re-uploading.
# Runs to completion once; Flux keeps it applied. Bump the version + SHA here in
# lockstep with sandboxconfig.yaml and runsc-cache.yaml when upgrading runsc.
#
# NOTE: this Job needs PUBLIC egress (storage.googleapis.com) to fetch the
# binary, so it does NOT carry the GPU-node/worker nodeSelector — it can run on
# any node with internet access. Only the atelet/worker path is egress-locked.
apiVersion: batch/v1
kind: Job
metadata:
  name: runsc-upload
  namespace: ai-system
  labels:
    app: runsc-upload
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app: runsc-upload
    spec:
      restartPolicy: OnFailure
      containers:
        - name: upload
          image: amazon/aws-cli:2.36.38
          env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: rustfs-credentials
                  key: access-key
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: rustfs-credentials
                  key: secret-key
            - name: AWS_DEFAULT_REGION
              value: us-east-1
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              # Keep VERSION + SHA in sync with sandboxconfig.yaml
              # (spec.assets.amd64.runsc) and runsc-cache.yaml.
              VERSION=20260622.0
              SHA=f18a948bf9c8bbb54eb998549a3a8d719a1c7de2efbe8fdd2ff0ee5fecd06f19
              ENDPOINT=http://rustfs.ai-system.svc:9000
              BUCKET=ate-snapshots
              KEY=runsc
              # Already uploaded? (survives Job re-runs / re-applies.)
              if aws --endpoint-url "$ENDPOINT" s3api head-object \
                   --bucket "$BUCKET" --key "$KEY" >/dev/null 2>&1; then
                echo "s3://$BUCKET/$KEY already present; nothing to do"
                exit 0
              fi
              echo "downloading runsc $VERSION from upstream gVisor release"
              curl -fsSL -o /tmp/runsc \
                "https://storage.googleapis.com/gvisor/releases/release/${VERSION}/x86_64/runsc"
              echo "verifying sha256"
              echo "$SHA  /tmp/runsc" | sha256sum -c -
              echo "uploading verified runsc -> s3://$BUCKET/$KEY"
              aws --endpoint-url "$ENDPOINT" s3 cp /tmp/runsc \
                "s3://$BUCKET/$KEY" --no-progress
              echo "runsc uploaded OK"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
