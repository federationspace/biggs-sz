---
# Hermes gateway secrets -- managed via External Secrets + 1Password.
#
# 1Password item required (biggs-sz vault): hermes-secrets, with fields:
#   anthropic-api-key   -- Anthropic API key (model provider)
#   matrix-access-token -- access token for the @hermes:gregbob.net bot on
#                          continuwuity (register the bot, log in as it, copy
#                          the token)
#   matrix-allowed-users-- comma-separated Matrix user IDs allowed to talk to
#                          the bot, e.g. "@you:gregbob.net"
#   dashboard-user      -- web dashboard basic-auth username
#   dashboard-pass      -- web dashboard basic-auth password
#   dashboard-secret    -- random string for restart-stable dashboard sessions
#                          (e.g. `openssl rand -hex 32`)
#
# All six become env vars in the Hermes container via envFrom. The Deployment
# maps them onto the exact variable names Hermes reads (see the target.template
# below): provider/platform vars plus the dashboard basic-auth gate vars.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hermes-secrets
  namespace: ai-system
  labels:
    app.kubernetes.io/name: hermes
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: hermes-secrets
    creationPolicy: Owner
    template:
      data:
        # Model provider
        ANTHROPIC_API_KEY: "{{ .anthropicApiKey }}"
        # Matrix platform
        MATRIX_ACCESS_TOKEN: "{{ .matrixAccessToken }}"
        MATRIX_ALLOWED_USERS: "{{ .matrixAllowedUsers }}"
        # Dashboard basic-auth gate (required for a non-loopback bind)
        HERMES_DASHBOARD_BASIC_AUTH_USERNAME: "{{ .dashboardUser }}"
        HERMES_DASHBOARD_BASIC_AUTH_PASSWORD: "{{ .dashboardPass }}"
        HERMES_DASHBOARD_BASIC_AUTH_SECRET: "{{ .dashboardSecret }}"
  data:
    - secretKey: anthropicApiKey
      remoteRef:
        key: hermes-secrets
        property: anthropic-api-key
    - secretKey: matrixAccessToken
      remoteRef:
        key: hermes-secrets
        property: matrix-access-token
    - secretKey: matrixAllowedUsers
      remoteRef:
        key: hermes-secrets
        property: matrix-allowed-users
    - secretKey: dashboardUser
      remoteRef:
        key: hermes-secrets
        property: dashboard-user
    - secretKey: dashboardPass
      remoteRef:
        key: hermes-secrets
        property: dashboard-pass
    - secretKey: dashboardSecret
      remoteRef:
        key: hermes-secrets
        property: dashboard-secret
