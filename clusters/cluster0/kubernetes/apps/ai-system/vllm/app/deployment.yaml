---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm
  namespace: ai-system
  labels:
    app: vllm
spec:
  # replicas is intentionally OMITTED: the gpu-arbiter-operator (gpu-arbiter CR
  # at clusters/cluster0/kubernetes/apps/dreamcast/gpu-arbiter-instance) owns this
  # Deployment's replica count, scaling it to 0 during Wolf gaming sessions and
  # back to 1 afterward. Declaring replicas here would make Flux fight the
  # arbiter on every reconcile. Unmanaged, a Deployment defaults to 1 replica,
  # so the idle state is a single vLLM.
  # Weights live on a RWO host-path volume on nv-01; never run two at once.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: vllm
  template:
    metadata:
      labels:
        app: vllm
    spec:
      # The Service is named "vllm", so Kubernetes injects legacy service-link
      # env vars (e.g. VLLM_PORT=tcp://<ip>:8000) that collide with vLLM's own
      # VLLM_PORT config and crash the engine. Disable the injection.
      enableServiceLinks: false
      # Pin to the GPU node (nv-01) by capability label rather than hostname,
      # matching the rest of the ai-system stack.
      nodeSelector:
        nvidia.com/gpu.present: "true"
      # Short grace so vLLM RELEASES VRAM fast when the gpu-arbiter-operator scales it to
      # 0 for a gaming session: the gaming pod is held by a scheduling gate until
      # VRAM is free, and direwolf reaps the session after 60s, so vLLM must let
      # go well before then. vLLM is stateless (weights on the PVC), so a quick
      # SIGTERM/SIGKILL is fine; it reloads on scale-up.
      terminationGracePeriodSeconds: 10
      containers:
        - name: vllm
          # ================================================================
          # biggs-sz GPU: RTX 3090 (Ampere, sm_86, 24 GiB) on nv-01.
          # ----------------------------------------------------------------
          # The source config targeted an RTX 5090 (Blackwell, sm_120, 32 GiB)
          # with an NVFP4 checkpoint (4-bit FLOAT — requires Blackwell tensor
          # cores, will NOT load on Ampere) and a 177184-token window tuned for
          # 32 GiB. Both were unrunnable on the 3090 and, because this
          # Kustomization gates the ai-system stack, an init failure blocked
          # reconciliation. This manifest now ships Ampere-compatible,
          # 24-GiB-safe values:
          #
          #   1. MODEL: an INT4 (AutoRound, auto-gptq-compatible) quant of the
          #      dense Qwen3.6-27B — INT4 weights run on Ampere sm_86. ~19 GiB
          #      of weights, the smallest verified public Ampere quant, leaving
          #      real KV headroom on 24 GiB. See --model below.
          #   2. VRAM/CONTEXT: --max-model-len is set CONSERVATIVELY (see the
          #      note there) so the KV pool fits on 24 GiB with margin for
          #      activations + CUDA graphs. This is a placeholder ceiling — the
          #      maintainer MUST re-measure on the real 3090 (vLLM prints the
          #      profiled KV ceiling on boot) and can raise it toward that
          #      number, never past util 0.96.
          #   3. --kv-cache-dtype=fp8 is well-supported on Ampere; keep it.
          #
          # NOTE: the specific checkpoint + exact context cap are a DECOUPLE
          # placeholder (this port does not have the GPU to measure on). Treat
          # --model and --max-model-len as maintainer-tunable, not final.
          # ================================================================
          image: docker.io/vllm/vllm-openai:v0.28.0
          args:
            # ----------------------------------------------------------------
            # MODEL (Ampere placeholder): an INT4 AutoRound quant of the dense
            # Qwen3.6-27B:
            #   https://huggingface.co/Lorbus/Qwen3.6-27B-int4-AutoRound
            # A 27B DENSE model (all params active). INT4 AutoRound weights are
            # auto-gptq-compatible and run on Ampere sm_86 (the 3090) — unlike
            # the source's NVFP4, which needs Blackwell. ~19 GiB of weights (the
            # smallest verified public Ampere quant of this model), so it leaves
            # real KV headroom on the 24 GiB card.
            # DECOUPLE NOTE: this is a PLACEHOLDER checkpoint chosen so the
            # manifest is runnable on the target GPU; the maintainer may swap it
            # for any other Ampere-validated (AWQ/GPTQ/INT4/GGUF) build. The old
            # NVFP4 lineage (rdtand PrismaSCOUT NVFP4, unsloth NVFP4) is retired
            # because NVFP4 cannot load on Ampere.
            # Quantization is AUTO-DETECTED from the checkpoint's
            # quantization_config -- do NOT pass --quantization (the old
            # --quantization=modelopt was for NVIDIA's 35B NVFP4 and is wrong
            # here).
            # --served-model-name must match the kagent HelmRelease provider
            # (kagent/app/helmrelease.yaml providers.openAI.model).
            # ----------------------------------------------------------------
            - --model=Lorbus/Qwen3.6-27B-int4-AutoRound
            # served-model-name is intentionally different from --model: the
            # slash in the HuggingFace path gets stripped by some clients (e.g.
            # Zed), causing 404s, and spaces in an id break others. This
            # slash-free, space-free, VERSION-AGNOSTIC alias fixes all clients
            # and survives a model swap without a rename; kagent and Zed use
            # this name, not the weights path. (The old space-containing
            # "qwen 3.8 - local" id is retired; kagent's provider was updated in
            # this same commit.)
            - --served-model-name=qwen-local
            # fp8 KV cache + hybrid attention keep the KV pool small even at
            # long context.
            - --kv-cache-dtype=fp8
            # 32K context (32768 tokens) — CONSERVATIVE 24-GiB placeholder.
            # This Qwen3.6-27B is a Gated-DeltaNet hybrid: only 16 of its 64
            # layers (full_attention_interval=4) keep paged KV, so long context
            # is cheaper than a fully-dense model — but the source's 177184 was
            # still profiled on a 32 GiB card and does NOT fit on 24 GiB. Per
            # the review's measurement for this model class on the 3090: ~19-20
            # GiB INT4 weights + FP8 KV for the 16 full-attention layers puts
            # the 177184 window well over 24 GiB, and the raw-KV ceiling at util
            # 0.96 is only ~94k tokens. A too-large window makes vLLM refuse to
            # boot (the exact failure the review flagged) and blocks the stack,
            # so 32768 is a safe floor chosen WITHOUT a 3090 to profile on.
            # MAINTAINER: on the real GPU, read vLLM's boot log — it prints the
            # profiled available KV and the "estimated maximum model length" —
            # and raise this toward that number (never past util 0.96). If long
            # agent context is needed and the ceiling is too low, the lever is a
            # smaller checkpoint or more VRAM, not a higher cap here.
            - --max-model-len=32768
            # Cap GPU memory at 0.96 on the 24 GiB 3090. 0.97 previously reserved
            # nearly the whole card and caused a full node lockup (2026-06-25),
            # so 0.96 is the documented CEILING — do NOT push past it. The GPU is
            # time-sliced (replicas=4) and shared with GPU-operator validators +
            # the DRA plugin; the embeddings server has moved to CPU so it no
            # longer contends for VRAM here. At ~19 GiB INT4 weights, 0.96 leaves
            # a few GiB for the fp8 KV pool + activations + CUDA graphs, which is
            # what the conservative 32768 window above is sized to fit.
            - --gpu-memory-utilization=0.96
            # Per-step token budget for (chunked) prefill + decode. Bumped from
            # 4096 to 8192 to handle medium-length tool-context prompts more
            # efficiently, reducing the number of prefill steps. Short prompts
            # are unaffected (they complete in one step). Long prompts benefit
            # from fewer scheduling rounds.
            - --max-num-batched-tokens=8192
            # Concurrency cap. Bumped from 64 to 32 after a vLLM stall/restart
            # under parallel kagent fan-out (6-9 agents firing long-context tool-
            # schema prompts simultaneously). At 64-way the GPU compute saturated
            # during prefill of multiple long prompts, stalling the async event
            # loop for 3+ min -- past even the generous 10s×6 liveness headroom --
            # and the pod restarted (exit 0, "Completed"). 32-way still matches or
            # exceeds realistic concurrent agent count, lets vLLM QUEUE excess
            # requests instead of compute-locking, and keeps /health responsive.
            # Keep capture-size == max-num-seqs. 8-way sizing: at the small 24-GiB
            # KV pool a single long sequence can consume most of it, so vLLM
            # admits a burst of short/medium agent prompts while QUEUEING (not
            # compute-locking) when several long-context sessions land together;
            # prefix caching + chunked prefill keep queued work moving. If agent
            # fan-out proves starved, the lever is more VRAM, not a higher
            # max-num-seqs at this window.
            - --max-num-seqs=8
            - --max-cudagraph-capture-size=8
            - --enable-prefix-caching
            # Qwen3.6's hybrid (Gated-DeltaNet) arch may ship custom modeling
            # code; the model card sets trust-remote-code. NOTE: executes repo
            # Python.
            - --trust-remote-code
            # Qwen3.6 tool-call + reasoning parsers (qwen3_5 arch family): the
            # dense 27B uses the qwen3_coder tool parser -- NOT the 35B's
            # qwen3_xml; reasoning parser stays qwen3.
            - --enable-auto-tool-choice
            - --tool-call-parser=qwen3_coder
            - --reasoning-parser=qwen3
            # Text-only kagent traffic: this checkpoint carries a vision tower
            # (qwen3_5 multimodal arch), so skip the vision encoder + multimodal
            # profiling entirely. Recommended for the VRAM fit -- loading the
            # vision tower would add resident weights and starve KV on 24 GiB.
            - --language-model-only
            # Keep port 8000 to match the Service and the kagent provider baseUrl.
            - --host=0.0.0.0
            - --port=8000
          env:
            - name: HF_HOME
              value: /models
            # Secures the OpenAI-compatible endpoint; kagent sends the same key.
            - name: VLLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: kagent-vllm
                  key: VLLM_API_KEY
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          resources:
            requests:
              nvidia.com/gpu: 1
              memory: 22Gi
            limits:
              # Consumes the last of the 4 time-sliced nvidia.com/gpu replicas.
              nvidia.com/gpu: 1
              memory: 22Gi
          startupProbe:
            httpGet:
              path: /health
              port: http
            # First boot downloads weights; allow up to ~30 min.
            periodSeconds: 15
            failureThreshold: 120
            # /health can be briefly slow even once serving; default 1s is tight.
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            # Same rationale as liveness below: with a SINGLE replica, flapping
            # out of the Service endpoints on a slow-but-alive /health just fails
            # all traffic, so give the check headroom instead of the default 1s.
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            # vLLM serves /health from the SAME async event loop that runs
            # inference; under heavy concurrent load (e.g. agent fan-out) it can
            # blow past the default 1s probe timeout. The default 1s timeout + 3
            # failures was SIGTERM-killing the pod under load -- a clean exit 0
            # "Completed" restart, i.e. a self-inflicted restart storm, NOT a
            # real hang. Give it real headroom so liveness only fires on a
            # genuine deadlock: 10s timeout x 6 failures = ~3 min of sustained
            # unresponsiveness before a restart.
            timeoutSeconds: 10
            failureThreshold: 6
          volumeMounts:
            - name: models
              mountPath: /models
            # vLLM needs a large shared-memory segment for NCCL/IPC.
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: vllm-models
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 8Gi
