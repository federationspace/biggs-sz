---
# llm.gregbob.net -> Radiance, on the shared wildcard Gateway (VIP
# 192.168.2.9). LAN clients resolve it via k8s-gateway; *.gregbob.net is also
# a public Cloudflare wildcard forwarded to the same VIP, so this route is
# internet-reachable. The llm-api-key policy (client token + rate limit)
# guards it. Engine-neutral hostname: the model behind it is swappable.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: llm
  namespace: ai-system
spec:
  hostnames:
    - llm.gregbob.net
  parentRefs:
    - name: wildcard-gregbob-net
      namespace: network
  rules:
    - backendRefs:
        - name: radiance
          group: agentgateway.dev
          kind: AgentgatewayBackend
      matches:
        - path:
            type: PathPrefix
            value: /
      # Long generations run for minutes.
      timeouts:
        request: 600s
        backendRequest: 600s
