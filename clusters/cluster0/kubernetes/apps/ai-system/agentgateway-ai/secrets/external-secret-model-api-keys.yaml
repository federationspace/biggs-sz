---
# Client tokens for llm.gregbob.net, validated by the llm-api-key
# AgentgatewayPolicy. Deliberately a different credential from the engine
# key: a leaked client token must not be a leaked Radiance key, and it can be
# rotated alone (edit the 1Password item; the 1h refresh picks it up).
#
# Each data key is an arbitrary identifier for one client; the VALUE is the
# raw token clients send as "Authorization: Bearer <token>". Add a client by
# adding a key (and its 1Password field).
#
# 1Password item (vault biggs-sz): radiance-model-api-key (api-key), >= 32
# characters, distinct from the radiance item's key.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: radiance-model-api-keys
  namespace: ai-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: radiance-model-api-keys
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        owner: "{{ .apiKey }}"
  data:
    - secretKey: apiKey
      remoteRef:
        key: radiance-model-api-key
        property: api-key
