---
# Upstream credential: agentgateway authenticates to Radiance with the
# engine's own key. Rendered as Secret "radiance-api-key" with key
# "Authorization", the key agentgateway's backend auth reads
# (AgentgatewayBackend.spec.policies.auth.secretRef).
#
# 1Password item (vault biggs-sz): radiance (api-key), the same item the
# Radiance Deployment reads (radiance/app/external-secret.yaml).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: radiance-api-key
  namespace: ai-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: radiance-api-key
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        Authorization: "{{ .apiKey }}"
  data:
    - secretKey: apiKey
      remoteRef:
        key: radiance
        property: api-key
