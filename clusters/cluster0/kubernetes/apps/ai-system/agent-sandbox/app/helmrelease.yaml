---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
# Upstream chart: agent-sandbox GitRepository (./helm). Required for kagent SandboxAgent
# CRs (agents.x-k8s.io Sandbox + extension APIs). After first install, restart
# kagent-controller so it registers the Sandbox API.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: agent-sandbox
  namespace: ai-system
spec:
  interval: 3m
  chart:
    spec:
      chart: ./helm
      # ChartVersion keeps .Chart.Version at Chart.yaml (0.1.0) without appending
      # the Git commit digest. Revision would produce 0.1.0+d0c124d4a1fd, which
      # breaks helm.sh/chart labels. We pin releases via GitRepository ref.tag
      # and values.image.tag instead of tracking every upstream commit.
      # CAVEAT: because Chart.yaml stays at 0.1.0 upstream, ChartVersion will
      # NOT produce a new artifact when the GitRepository ref.tag advances to a
      # later commit at the same chart version — so a future controller bump
      # requires moving BOTH the GitRepository ref.tag AND values.image.tag
      # (below) together, and they MUST stay on the same upstream tag to avoid
      # a CRD/controller API skew.
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: GitRepository
        name: agent-sandbox
        namespace: flux-system
  install:
    createNamespace: false
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    cleanupOnFail: true
    remediation:
      retries: 3
  # Pin the agent-sandbox controller pod to the GPU node (nv-01), matching
  # the rest of the ai-system stack. JSON 6902 patch (op: add) targets the
  # chart's Deployment; safe because the chart sets no nodeSelector by default.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
            patch: |-
              - op: add
                path: /spec/template/spec/nodeSelector
                value:
                  nvidia.com/gpu.present: "true"
  values:
    namespace:
      create: false
      name: ai-system
    image:
      # MUST match the agent-sandbox GitRepository ref.tag (v0.5.5,
      # flux-system/sources/agent-sandbox-git.yaml). The Sandbox API + CRDs
      # changed between v0.5.0 and v0.5.5, so running the v0.5.0 controller
      # against v0.5.5 CRDs (installed from the checkout) is an unsupported skew.
      tag: v0.5.5
    controller:
      # SandboxTemplate / SandboxClaim controllers (needed for kagent SandboxAgent).
      extensions: true
