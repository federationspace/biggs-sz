# kagent 0.10.7 (0.x line, no substrate): CRDs via the kagent-crds OCI
# chart, then credentials, then the main chart. The main chart renders
# ModelConfig + Agent CRs, so it must wait for the CRDs. cnpg-databases
# (wait: true upstream) gates the controller's Postgres.
# 1.0-line cutover later: new API group api.kagent.dev/v1alpha3, substrate
# stack, and a recreated kagent DB.
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app kagent-crds
  namespace: flux-system
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  path: ./clusters/cluster0/kubernetes/apps/ai-system/kagent/crds
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  targetNamespace: ai-system
  wait: true
  interval: 3m
  retryInterval: 1m
  timeout: 2m
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app kagent-credentials
  namespace: flux-system
spec:
  dependsOn:
    # ClusterSecretStore (onepassword-connect) for the ExternalSecrets.
    - name: secretstore
  targetNamespace: ai-system
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  path: ./clusters/cluster0/kubernetes/apps/ai-system/kagent/credentials
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
  healthCheckExprs:
    # wait alone does not gate on ExternalSecret readiness; the main chart
    # must not install before both Secrets exist (same pattern as
    # agentgateway-ai-secrets).
    - apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      current: has(status.conditions) && status.conditions.exists(e, e.type == 'Ready' && e.status == 'True')
  interval: 3m
  retryInterval: 1m
  timeout: 2m
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app kagent
  namespace: flux-system
spec:
  targetNamespace: ai-system
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  path: ./clusters/cluster0/kubernetes/apps/ai-system/kagent/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  # wait: false (AGENTS convention: nothing depends on this Kustomization);
  # HelmRelease readiness is the convergence signal, and the first
  # converge of 4 workloads exceeds a 2m wait window.
  wait: false
  interval: 3m
  retryInterval: 1m
  timeout: 2m
  dependsOn:
    - name: kagent-crds
    - name: kagent-credentials
    - name: cnpg-databases
