# Materializes Secret "kagent-radiance-key" for the kagent default
# ModelConfig. 1Password item (vault biggs-sz): radiance (api-key) - same
# item the radiance engine itself and agentgateway-ai use.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kagent-radiance-key
  namespace: ai-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: kagent-radiance-key
    creationPolicy: Owner
  data:
    - secretKey: RADIANCE_API_KEY
      remoteRef:
        key: radiance
        property: api-key
