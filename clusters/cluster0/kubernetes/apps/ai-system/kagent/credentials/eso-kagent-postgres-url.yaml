# 1Password: item kagent-user-password (username, password) - the CNPG
# cnpg-kagent bootstrap login. Shape mirrors media/silo silo-database-url.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kagent-postgres-url
  namespace: ai-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: kagent-postgres-url
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        url: >-
          postgres://{{ .username | urlquery }}:{{ .password | urlquery }}@cnpg-kagent-rw.cnpg-system.svc.cluster.local:5432/kagent
  data:
  - secretKey: username
    remoteRef:
      key: kagent-user-password
      property: username
  - secretKey: password
    remoteRef:
      key: kagent-user-password
      property: password
