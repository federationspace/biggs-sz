---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kagent
  namespace: ai-system
  labels:
    app.kubernetes.io/name: kagent
spec:
  hostnames:
  - kagent.gregbob.net
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: wildcard-gregbob-net
    namespace: network
  rules:
  - backendRefs:
    - name: kagent-ui
      port: 8080
    matches:
    - path:
        type: PathPrefix
        value: /
