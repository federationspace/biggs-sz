---
# SSO forward-auth in front of the kagent UI via oauth2-proxy.
# See the rook-ceph policy for a description of the /oauth2/auth ext-authz flow.
# This protects the browser UI only; the MCP endpoint (kagent-mcp) uses
# API-key auth (kagent-mcp-api-key policy) for machine clients.
#
# PREREQUISITE (biggs-sz port): this policy references an `oauth2-proxy` Service
# in an `auth` namespace and an `auth.gregbob.net` SSO endpoint. Neither exists
# in biggs-sz yet. The policy is intentionally KEPT (not stripped) because it
# fails CLOSED: until oauth2-proxy is deployed, the kagent UI route rejects all
# requests rather than exposing an unauthenticated AI agent UI on the public
# (*.gregbob.net -> Cloudflare) gateway. Deploy oauth2-proxy (namespace `auth`,
# Service `oauth2-proxy`) + an `auth.gregbob.net` route to enable UI access, or
# remove this file to expose the UI unauthenticated (NOT recommended).
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: kagent-ui-forward-auth
  namespace: ai-system
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: kagent
  traffic:
    extAuth:
      backendRef:
        group: ""
        kind: Service
        name: oauth2-proxy
        namespace: auth
        port: 80
      http:
        path: '"/oauth2/auth"'
        allowedRequestHeaders:
          - cookie
          - authorization
        allowedResponseHeaders:
          - authorization
          - x-auth-request-user
          - x-auth-request-email
          - x-auth-request-groups
          - x-auth-request-preferred-username
        redirect: '"https://auth.gregbob.net/oauth2/start?rd=https://kagent.gregbob.net" + request.path'
