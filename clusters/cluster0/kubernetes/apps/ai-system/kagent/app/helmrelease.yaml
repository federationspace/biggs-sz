# kagent 0.10.7 controller + UI + tools + kmcp + built-in k8s-agent.
# Every built-in agent defaults to enabled=true (demo profile); this values
# block keeps k8s-agent (the test agent) and disables the rest.
# Default ModelConfig -> local radiance (model "local"). Postgres is BYO
# cnpg-kagent; the connection string Secret is mounted read-only at
# /etc/kagent-db/url.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kagent
  namespace: ai-system
spec:
  chartRef:
    kind: OCIRepository
    name: kagent
    namespace: flux-system
  interval: 3m
  # Flux's helm-controller records OCI chart versions as
  # "<version>+<digest12>" (e.g. 0.10.7+b3c52625e511) and the 0.10.x chart
  # stamps that unsanitized string into the app.kubernetes.io/version label
  # of its 15 main-chart objects ("+" is an invalid label value ->
  # InstallFailed). It sanitizes helm.sh/chart (underscore, valid), which
  # is what the patch targets; subchart objects keep their own plain
  # versions (tools 0.3.2, kmcp 0.3.0) and are untouched. Image tags are
  # fixed separately by pinning values.tag, which the templates coalesce
  # ahead of .Chart.Version. The digest is immutable per tag, so the
  # literal is stable; if the chart is ever re-published under 0.10.7 the
  # target stops matching and the invalid label reappears.
  postRenderers:
    - kustomize:
        patches:
          - patch: |-
              - op: replace
                path: /metadata/labels/app.kubernetes.io~1version
                value: "0.10.7"
            target:
              labelSelector: helm.sh/chart=kagent-0.10.7_b3c52625e511
  values:
    # Image tag fallback: templates use coalesce .Values.tag ... .Chart.Version
    # for controller/ui/agent images; .Chart.Version carries the invalid
    # "+digest" suffix under Flux OCI installs.
    tag: "0.10.7"
    providers:
      default: openAI
      openAI:
        provider: OpenAI
        model: local
        apiKeySecretRef: kagent-radiance-key
        apiKeySecretKey: RADIANCE_API_KEY
        config:
          baseUrl: http://radiance.ai-system.svc:8000/v1
    database:
      postgres:
        bundled:
          enabled: false
        urlFile: /etc/kagent-db/url
        vectorEnabled: false
    controller:
      # Chart default pod securityContext is runAsNonRoot + RuntimeDefault
      # with fsGroup commented out; the controller image runs as 65532:65532.
      # Without fsGroup the mounted Secret file is root:root 0400 and uid
      # 65532 cannot read /etc/kagent-db/url. fsGroup makes the file
      # group-owned, so 0440 grants exactly the controller group read.
      podSecurityContext:
        runAsNonRoot: true
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: kagent-db
          secret:
            secretName: kagent-postgres-url
            # 0440 in decimal (288). Written as octal 0440 in values.yaml
            # this survives helm's YAML-1.2 values parse as decimal 440
            # (mode 0670); bare decimal is unambiguous in both parsers.
            defaultMode: 288
      volumeMounts:
        - name: kagent-db
          mountPath: /etc/kagent-db
          readOnly: true
    k8s-agent:
      enabled: true
    kgateway-agent:
      enabled: false
    istio-agent:
      enabled: false
    promql-agent:
      enabled: false
    observability-agent:
      enabled: false
    argo-rollouts-agent:
      enabled: false
    helm-agent:
      enabled: false
    cilium-policy-agent:
      enabled: false
    cilium-manager-agent:
      enabled: false
    cilium-debug-agent:
      enabled: false
    grafana-mcp:
      enabled: false
    kagent-tools:
      enabled: true
      # Kritika P1 on #410: the subchart default (rbac.readOnly: false)
      # renders a cluster-admin ClusterRole (*/ */ * + nonResourceURLs *)
      # bound cluster-wide to the LLM-driven tools service. Read-only is
      # the right floor for a test agent: cluster-wide inspection, no
      # mutation, no secret access. Widen deliberately if write
      # experiments are ever wanted.
      rbac:
        readOnly: true
    kmcp:
      enabled: true
