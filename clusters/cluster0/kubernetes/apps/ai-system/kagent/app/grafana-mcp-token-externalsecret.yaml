# Grafana MCP Service Account Token
#
# 1Password item required (biggs-sz vault): grafana-mcp
#   token — a Grafana service-account token (Administration -> Service accounts)
#           with the permissions the mcp/grafana server needs (dashboards/datasources
#           read at minimum). Create the item, then this ExternalSecret picks it up.
#
# Materializes secret "kagent-grafana-mcp-token" (key: GRAFANA_SERVICE_ACCOUNT_TOKEN),
# consumed by the kagent HelmRelease post-renderer env patch on the
# kagent-grafana-mcp Deployment (see kagent/app/helmrelease.yaml).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kagent-grafana-mcp-token
  namespace: ai-system
  labels:
    app.kubernetes.io/name: grafana-mcp
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: kagent-grafana-mcp-token
    creationPolicy: Owner
  data:
    - secretKey: GRAFANA_SERVICE_ACCOUNT_TOKEN
      remoteRef:
        key: grafana-mcp
        property: token
