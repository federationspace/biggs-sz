---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: wildcard-gregbob-net
  namespace: network
spec:
  gatewayClassName: agentgateway
  infrastructure:
    annotations:
      # Pin the client-facing Gateway Service's LB IP. k8s-gateway answers all
      # gregbob.net HTTPRoute hostnames with this IP and the UDM port-forwards
      # 80/443 to it, so a Service recreation must not be able to move it.
      io.cilium/lb-ipam-ips: "192.168.2.9"
  listeners:
  - hostname: "*.gregbob.net"
    name: wildcard-gregbob-net-http
    port: 80
    protocol: HTTP
    allowedRoutes:
      namespaces:
        from: All
  - hostname: "*.gregbob.net"
    name: wildcard-gregbob-net-https
    port: 443
    protocol: HTTPS
    allowedRoutes:
      namespaces:
        from: All
    tls:
      mode: Terminate
      certificateRefs:
      - kind: Secret
        name: wildcard-gregbob-net
  - hostname: "gregbob.net"
    name: gregbob-net-http
    port: 80
    protocol: HTTP
    allowedRoutes:
      namespaces:
        from: All
  - hostname: "gregbob.net"
    name: gregbob-net-https
    port: 443
    protocol: HTTPS
    allowedRoutes:
      namespaces:
        from: All
    tls:
      mode: Terminate
      certificateRefs:
      - kind: Secret
        name: wildcard-gregbob-net