---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: continuwuity
  namespace: matrix
spec:
  hostnames:
    - matrix.gregbob.net
  parentRefs:
    - name: wildcard-gregbob-net
      namespace: network
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /_matrix
      backendRefs:
        - name: continuwuity-service
          port: 8080
    - matches:
        - path:
            type: PathPrefix
            value: /_continuwuity/
      backendRefs:
        - name: continuwuity-service
          port: 8080
    # Catch-all, listed last so the prefixes above keep priority. Continuwuity
    # serves its own landing page and /.well-known/matrix/* on the host, so
    # without this the gateway answers "route not found" for anything outside
    # /_matrix and /_continuwuity/.
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: continuwuity-service
          port: 8080
