---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: continuwuity-well-known
  namespace: matrix
spec:
  hostnames:
  - gregbob.net
  parentRefs:
  - name: wildcard-gregbob-net
    namespace: network
  rules:
  - backendRefs:
    - name: continuwuity-service
      port: 8080
    matches:
    - path:
        type: PathPrefix
        value: /.well-known/matrix
