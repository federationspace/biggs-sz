apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: irc
  name: irc
  namespace: gregbob
spec:
  # Single server: UnrealIRCd keeps all channel/global state in memory.
  # Do NOT scale above 1 without introducing a server-link topology.
  replicas: 1
  selector:
    matchLabels:
      app: irc
  template:
    metadata:
      labels:
        app: irc
    spec:
      containers:
        - name: irc
          image: ircd/unrealircd:latest
          imagePullPolicy: Always
          # The image's baked-in CMD is a malformed single-string JSON array
          # ("/app/unrealircd/bin/unrealircd -F" -> exec fails: runc tries to
          # stat "unrealircd -F" as one path, exit 128). Override it here.
          # -F = foreground (required in a container).
          command: ["/app/unrealircd/bin/unrealircd"]
          args: ["-F"]
          ports:
            - name: irc
              containerPort: 6667
              protocol: TCP
            - name: ircs
              containerPort: 6697
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /ircd/unrealircd.conf
              subPath: unrealircd.conf
              readOnly: true
            - name: tls
              mountPath: /ircd/tls/server.crt
              subPath: tls.crt
              readOnly: true
            - name: tls
              mountPath: /ircd/tls/server.key
              subPath: tls.key
              readOnly: true
          resources:
            requests:
              memory: 64Mi
              cpu: 20m
            limits:
              memory: 256Mi
      volumes:
        - name: config
          configMap:
            name: irc-config
        - name: tls
          secret:
            secretName: irc-tls
      terminationGracePeriodSeconds: 30
