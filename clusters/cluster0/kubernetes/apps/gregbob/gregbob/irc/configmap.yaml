# UnrealIRCd 6 config for irc.gregbob.net (single-server homelab network).
# Based on the official v6 example.conf (unrealircd/unrealircd, unreal60_dev).
#
# The ircd/unrealircd image ships the stock include files in /ircd (its
# WORKDIR): modules.default.conf, help/, badwords.conf, operclass.default.conf,
# snomasks.default.conf. Includes below are relative to /ircd.
#
# NOTE: the cloak-keys are secret in a real deployment. This is a single
# homelab server in a private repo; rotate them (unrealircdctl gencloak) if
# this repo is ever made public.
apiVersion: v1
kind: ConfigMap
metadata:
  labels:
    app: irc
  name: irc-config
  namespace: gregbob
data:
  unrealircd.conf: |
    /* Load modules + stock config files shipped by the image (see /ircd). */
    include "modules.default.conf";
    include "help/help.conf";
    include "badwords.conf";
    include "operclass.default.conf";
    include "snomasks.default.conf";

    /* Cloaking (sha256, default since UnrealIRCd 5). */
    loadmodule "cloak_sha256";

    /* Who we are: single server, first (and only) sid. */
    me {
        name "irc.gregbob.net";
        info "Greg's homelab IRC server (UnrealIRCd 6)";
        sid "001";
    }

    admin {
        "Greg";
        "greg";
        "irc@gregbob.net";
    }

    class clients {
        pingfreq 90;
        maxclients 1000;
        sendq 200k;
        recvq 8000;
    }

    class opers {
        pingfreq 90;
        maxclients 50;
        sendq 1M;
        recvq 8000;
    }

    class servers {
        pingfreq 60;
        connfreq 15;
        maxclients 10;
        sendq 20M;
    }

    /* Allow everyone, max 3 connections per IP. */
    allow {
        mask *;
        class clients;
        maxperip 3;
    }

    set {
        network-name     "GregBobNet";
        default-server   "irc.gregbob.net";
        services-server  "irc.gregbob.net";
        stats-server     "irc.gregbob.net";

        help-channel     "#Help";
        prefix-quit      "Quit";

        /* Shown when a user is banned (kline). */
        kline-address    "irc@gregbob.net";

        /* 3 x 80-char random strings (gencloak). Secret - see note above. */
        cloak-keys {
            "vZbyqrBONmgOn53ai2NO6JfihUB7mTwfU07HfvxaNlmtqhTGZN3QBIGF5Y5x3idhSWfUCSlEsCUz04Px";
            "oJuRLKfQw2fhznqW4bjMwVGyxxvxGxhcmDBVVTc5LNBHh24sWxvF6cFLs0UoEf97vc5E8JJFicX2qmlz";
            "SSqB1D7vxdLRyNWmkhNlosWKmXfMvQn9O6eSwnohGFTgNEyEgulSqmx36Gyb2QBhunHRWLwCDjP0PVOB";
        }
    }

    set {
        modes-on-connect "+ixw";
        modes-on-oper    "+xws";
        modes-on-join    "+nt";

        maxchannelsperuser 10;

        anti-spam-quit-message-time 10s;

        options {
            hide-ulines;
            show-connect-info;
        }
    }

    /* TLS for the :6697 listener (self-signed; see tls-secret.yaml).
       The daemon refuses to start without at least one TLS port. */
    set {
        tls {
            certificate "/ircd/tls/server.crt";
            key "/ircd/tls/server.key";
        }
    }

    /* Plaintext IRC on 6667. */
    listen {
        ip *;
        port 6667;
    }

    /* TLS on 6697. */
    listen {
        ip *;
        port 6697;
        options { tls; }
    }

    /* UnrealIRCd can only log to a file or syslog (no stdout).
       /ircd is writable by the `unreal` user. */
    log {
        source {
            all;
            !debug;
            !join.LOCAL_CLIENT_JOIN;
            !join.REMOTE_CLIENT_JOIN;
            !part.LOCAL_CLIENT_PART;
            !part.REMOTE_CLIENT_PART;
            !kick.LOCAL_CLIENT_KICK;
            !kick.REMOTE_CLIENT_KICK;
        }
        destination {
            file "ircd.log" { maxsize 10M; }
        }
    }
