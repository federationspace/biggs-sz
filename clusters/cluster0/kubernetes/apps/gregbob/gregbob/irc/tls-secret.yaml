# Self-signed TLS cert+key for the irc.gregbob.net :6697 listener.
# Generated with:
#   openssl req -x509 -newkey rsa:2048 -nodes -days 3650 \
#     -keyout key.pem -out cert.pem -subj "/CN=irc.gregbob.net" \
#     -addext "subjectAltName=DNS:irc.gregbob.net,DNS:gregbob.net"
#
# SECRET MATERIAL (self-signed, single-server homelab network). This is a
# private repo; if it ever goes public, delete this file and rotate.
# Clients (IRC clients, /identify via TLS) will need to trust this self-signed
# cert or accept the warning.
apiVersion: v1
kind: Secret
metadata:
  labels:
    app: irc
  name: irc-tls
  namespace: gregbob
type: Opaque
data:
  tls.crt: 
  tls.key: 
